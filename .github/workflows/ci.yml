name: CI

# Pull requests, and pushes to main (a branch's push needs no run of its own: its pull request runs the same jobs);
# and the release train's quality gate (release.yml calls it with release_gate on the commit a nightly builds).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check
        required: true
        type: string
      release_gate:
        description: Called by release.yml
        required: true
        type: boolean

# A newer push to the same branch or PR cancels the run in progress; a release gate has a group of its own, so nothing
# cancels it.
concurrency:
  group: ${{ inputs.release_gate && format('ci-release-{0}', github.run_id) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs.release_gate }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches the Gradle distribution, dependencies and build cache.
      - uses: gradle/actions/setup-gradle@v5

      # Testcontainers needs the runner's Docker daemon; tests fail (never skip) without it.
      - name: Require Docker
        run: docker info --format 'Docker {{.ServerVersion}}'

      - name: ktlint
        run: ./gradlew :backend:ktlintCheck

      - name: detekt
        run: ./gradlew :backend:detektMain :backend:detektTest

      - name: Tests (Testcontainers) and coverage floor
        run: ./gradlew :backend:test :backend:koverXmlReport :backend:koverHtmlReport :backend:koverVerify :backend:koverLog

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/build/reports/kover/
          if-no-files-found: ignore

      - name: Upload test and lint reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/build/reports/tests/
            backend/build/reports/detekt/
            backend/build/reports/ktlint/
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # The instrumented unit tests alone take about 15 minutes on a hosted runner; the whole job ran past 20.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests with coverage thresholds
        run: npm run test:coverage
      # The production build as Cloudflare deploys it: `next build` (with its standalone output) through OpenNext, then
      # the Worker, checked against Workers' size limit.
      - name: Build (next build + Cloudflare Worker)
        run: npm run cf:check
      # First-load JS/CSS per key route (gzip) against perf/bundle-baseline.json; prints the table either way.
      - name: Bundle-size budget
        run: npm run perf:bundle

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  # The repository's own tooling under scripts/ (the pull request checks, the release train) and its tests.
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Script tests
        run: npm run test:scripts
      - name: Shell scripts
        run: shellcheck deploy/server/*.sh deploy/backup/*.sh scripts/release/*.sh

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Only mobile/ is installed: the website code it shares (frontend/src/lib) resolves its packages from
      # mobile/node_modules (mobile/shared-code.js).
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Design tokens (with selftest)
        run: npm run lint:tokens
      - run: npm run typecheck
      - name: App config resolves for every variant
        run: |
          for variant in development preview production; do
            APP_VARIANT=$variant npx expo config --type public > /dev/null
          done
      # Includes the shared-code boundary (scripts/shared-boundary.test.js) and the whole-app flows.
      - name: Unit, component and app tests with coverage thresholds
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: mobile/coverage/
          if-no-files-found: ignore

  simulation-checks:
    name: Simulation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: simulation/package-lock.json

      # Only simulation/ is installed: the website's API client it runs (frontend/src/lib) resolves its packages from
      # simulation/node_modules (tsconfig.json paths), as the mobile app's shared code does.
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests with coverage thresholds
        run: npm run test:coverage

  simulation:
    name: Simulation (10 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bookanything_sim
          POSTGRES_USER: bookanything
          POSTGRES_PASSWORD: bookanything
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookanything -d bookanything_sim"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # The same development backend as the E2E job: dev auth, the dev payment provider, no external services.
      APP_ENV: development
      AUTH_MODE: dev
      AI_FAKE_SCRIPT: demo
      # A few hundred bookings come from one address in ten minutes; development only.
      RATE_LIMIT_MULTIPLIER: "50"
      DATABASE_URL: jdbc:postgresql://localhost:5432/bookanything_sim
      DATABASE_USERNAME: bookanything
      DATABASE_PASSWORD: bookanything
      APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: simulation/package-lock.json

      - name: Build backend
        run: ./gradlew :backend:installDist

      - name: Migrate
        run: backend/build/install/backend/bin/backend migrate

      - name: Start backend
        run: |
          nohup backend/build/install/backend/bin/backend > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/v1/health && exit 0
            sleep 2
          done
          echo "Backend did not become healthy"; cat backend.log; exit 1

      - name: Install simulation dependencies
        working-directory: simulation
        run: npm ci

      # Fails on any invariant violation (docs/simulation.md); the report also goes to the job summary. The seed is the
      # run's: a failure is replayed with `scripts/simulation.sh replay --from-log` on the uploaded log.
      - name: Run the simulation
        working-directory: simulation
        env:
          SIM_BASE_URL: http://localhost:8080
          SIM_APP_URL: http://localhost:3000
          SIM_DATABASE_URL: postgres://bookanything:bookanything@localhost:5432/bookanything_sim
          SIM_SEED: ci-${{ github.run_id }}-${{ github.run_attempt }}
          SIM_DURATION: 10m
          SIM_RATE: "90"
        run: npm run sim

      - name: Upload the action log, report and backend log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: simulation
          path: |
            simulation/out/
            backend.log
          if-no-files-found: ignore

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bookanything_ci
          POSTGRES_USER: bookanything
          POSTGRES_PASSWORD: bookanything
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookanything -d bookanything_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Backend: development mode with dev auth and the scripted fake model (no external services).
      APP_ENV: development
      AUTH_MODE: dev
      AI_FAKE_SCRIPT: demo
      # Bo is off by default; the suite runs with it on, then assistant-off.spec.ts against the backend restarted
      # without it (the last steps). The frontend is built with the default (NEXT_PUBLIC_ASSISTANT_ENABLED unset).
      ASSISTANT_ENABLED: "true"
      # One suite run books ~20 times through one address (the public limit is 20 per 10 minutes); development only.
      RATE_LIMIT_MULTIPLIER: "50"
      DATABASE_URL: jdbc:postgresql://localhost:5432/bookanything_ci
      DATABASE_USERNAME: bookanything
      DATABASE_PASSWORD: bookanything
      APP_BASE_URL: http://localhost:3000
      # Frontend: rewrites /api to the backend (read at build time) and keeps the /dev routes in the build.
      BACKEND_ORIGIN: http://localhost:8080
      NEXT_PUBLIC_ENABLE_DEV_ROUTES: "true"
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        run: ./gradlew :backend:installDist

      - name: Migrate and seed demo data
        run: backend/build/install/backend/bin/backend seed-demo

      - name: Start backend
        run: |
          nohup backend/build/install/backend/bin/backend > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/v1/health && exit 0
            sleep 2
          done
          echo "Backend did not become healthy"; cat backend.log; exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run start -- -p 3000 > ../frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "Frontend did not start"; cat ../frontend.log; exit 1

      - name: Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Every project (desktop Chrome, Pixel 7, performance) runs on Chromium.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run Playwright (desktop + mobile)
        working-directory: frontend
        run: npx playwright test --project=chromium --project=mobile

      # On its own, after the suite, so nothing else shares the CPU it measures (about two minutes). The report also
      # goes to the job summary.
      - name: Web-vitals budgets
        working-directory: frontend
        env:
          PERF_REPORT: perf-report/web-vitals
        run: npx playwright test --project=performance --workers=1

      # Bo switched off, as in production: the same build against the backend restarted without ASSISTANT_ENABLED.
      - name: Restart backend with Bo off
        run: |
          pid="$(cat backend.pid)"
          kill "$pid"
          for i in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then kill -9 "$pid"; sleep 1; fi
          ASSISTANT_ENABLED=false nohup backend/build/install/backend/bin/backend > backend-assistant-off.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/v1/health && exit 0
            sleep 2
          done
          echo "Backend did not become healthy"; cat backend-assistant-off.log; exit 1

      - name: Run Playwright with Bo off
        working-directory: frontend
        env:
          E2E_ASSISTANT: "off"
        run: npx playwright test assistant-off.spec.ts --project=chromium --project=mobile

      - name: Upload web-vitals report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-vitals-report
          path: frontend/perf-report/
          if-no-files-found: ignore

      - name: Upload Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend.log
            backend-assistant-off.log
            frontend.log
          if-no-files-found: ignore
