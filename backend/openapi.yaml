openapi: 3.1.0
info:
  title: bookanything API
  version: 0.1.0
  description: |
    HTTP API of the bookanything backend (Kotlin/Ktor). Every route is under `/v1`.
    Business-scoped routes are under `/v1/businesses/{businessId}`.

    ## Authentication
    Send `Authorization: Bearer <token>`:
    - In production (`AUTH_MODE=clerk`) the token is a Clerk session JWT (RS256, from `getToken()`).
    - When `AUTH_MODE=dev` (development only) the token is `dev.<base64url(JSON)>`, where the JSON is
      `{"sub":"dev_<anything>","email":"x@y.z","name":"X Y"}`. The email counts as verified.

    If an `Authorization` header is present but invalid, the request always fails with 401 `UNAUTHENTICATED`,
    even on routes where auth is optional. The request is never treated as a guest.

    ## Roles
    Business-scoped routes need an active membership of the business with at least the stated role
    (`staff` < `admin` < `owner`). If the business does not exist, is suspended, or the caller is not a member,
    the response is 404 `NOT_FOUND`. If the role is too low, it is 403 `FORBIDDEN`. Staff members only see and
    act on bookings/customers/calendars of resources linked to them (`resources.memberId`), as noted per operation.

    ## Conventions
    - JSON only, camelCase. Response objects always contain every documented property; nullable properties are sent as `null`.
    - IDs are UUID strings. Money is integer minor units (cents) plus an ISO 4217 `currency`.
    - Instants are ISO-8601 with offset, rendered in the business timezone and without fractional seconds,
      e.g. `2026-10-01T09:00:00+01:00`. Dates are `YYYY-MM-DD` and times of day are `HH:mm`.
      Both are interpreted in the business timezone.
    - Request bodies ignore unknown keys. A missing required property or a wrong type gives 400 `INVALID_REQUEST`, with `fields` where possible.
    - Request bodies are at most 256 KB (64 KB for OAuth endpoints; 1 MB for `PUT …/site`, `POST /v1/businesses` and webhooks).
      A larger body, declared or chunked, gives 413 `PAYLOAD_TOO_LARGE`. Responses are `Cache-Control: no-store` unless
      an operation says otherwise.
    - PATCH bodies are partial: an absent key leaves the value unchanged, and an explicit `null` clears a nullable field.
    - Pagination: `?limit=` (1..200, default 50) and `?cursor=`, returning `{items, nextCursor}`. `nextCursor` is `null` on the last page.
    - Every response carries an `X-Request-Id` header. You can supply one yourself: 8-128 characters from `[A-Za-z0-9._-]`.
    - Unexpected failures return 500 `INTERNAL_SERVER_ERROR`. If the database is unreachable, the response is 503 `DATABASE_UNAVAILABLE`.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearer: []
tags:
  - name: health
    description: Liveness and database check.
  - name: public
    description: Public booking pages (no account needed).
  - name: manage
    description: Guest booking management via the secret manage token from the confirmation email.
  - name: dev-payments
    description: Development payment provider (only when the provider is `dev` and not in production; 404 otherwise).
  - name: webhooks
    description: Provider webhooks (Stripe, Clerk). Signature-verified, stored once in `provider_events`.
  - name: dev
    description: Development-only helpers (404 in production).
  - name: me
    description: The signed-in user.
  - name: onboarding
    description: Creating businesses, slug checks and AI drafts.
  - name: business
    description: Business settings and dashboard overview.
  - name: customer-groups
    description: Customer groups (e.g. members, students) used for restricted availability and services.
  - name: questions
    description: Booking form questions.
  - name: resources
    description: Bookable resources (people, spaces, equipment).
  - name: availability
    description: Weekly rules, date overrides and business closures.
  - name: services
    description: Services with options, add-ons and resource requirements.
  - name: bookings
    description: Dashboard booking management and staff availability.
  - name: customers
    description: Customer records (CRM, GDPR erase/export).
  - name: team
    description: Team members and invitations.
  - name: reports
    description: Reports and audit log.
  - name: payments
    description: Payment provider connection.
  - name: billing
    description: Plan and subscription.
  - name: site
    description: 'The public site builder (section 15): site plans, versions, publishing, AI generation and edits, stock photos.'
  - name: uploads
    description: Image uploads for sites and branding.
  - name: ai
    description: 'AI usage metering and credits (section 16): every model call is reserved, settled and costed.'
  - name: assistant
    description: 'Bo, the business assistant (section 17): conversations over SSE, proposals, memory and nudges.'
  - name: marketplace
    description: 'The public marketplace (section 18): search listed businesses; the owner''s listing setting.'
  - name: offers
    description: 'Deals (section 19): off-peak and last-minute offers applied automatically to the booking price.'
  - name: releases
    description: 'Release schedules (section 21): when each day''s times open for online booking, and changes to one day''s release.'
  - name: oauth
    description: 'OAuth 2.1 authorization server for the signed-in customer MCP (section 20), consent and connected apps.'
  - name: mcp
    description: Model Context Protocol servers for AI assistants.

paths:
  # ------------------------------------------------------------------ health
  /v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health check
      description: Checks database connectivity with a 3 second timeout, and says which release answers. No auth.
      security: []
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: The database is unavailable. The body is `Health`, not `Error`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  # ------------------------------------------------------------------ public
  /v1/public/templates:
    get:
      tags: [public]
      operationId: listTemplates
      summary: List industry templates
      security: []
      responses:
        '200':
          description: Template summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TemplateSummary' }

  /v1/public/templates/{key}:
    parameters:
      - $ref: '#/components/parameters/TemplateKey'
    get:
      tags: [public]
      operationId: getTemplate
      summary: Get a template's full business setup
      description: Returns the template's `BusinessSetup` with `source` set to `"template"`.
      security: []
      responses:
        '200':
          description: The setup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessSetup' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/public/businesses/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [public]
      operationId: getPublicBusiness
      summary: Get a public business profile
      description: |
        Returns 404 unless the business is `active`. Members of a `draft` business can preview it by sending their
        bearer token, so auth is optional here.
      security:
        - {}
        - bearer: []
      responses:
        '200':
          description: The business.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBusiness' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/public/businesses/{slug}/services:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [public]
      operationId: listPublicServices
      summary: List bookable services
      description: |
        Lists active, public services with their active questions (business-wide plus service-specific).
        Services that need online payment (`full`/`deposit` with a price) are hidden until the business can take payments.
        Auth is optional, as for `getPublicBusiness` (draft preview).
      security:
        - {}
        - bearer: []
      responses:
        '200':
          description: Services.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicService' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/public/businesses/{slug}/availability:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [public]
      operationId: getPublicAvailability
      summary: Get bookable slots for a service
      description: |
        Returns customer-facing availability, applying minimum notice, maximum advance and group restrictions.
        The range `from`..`to` is inclusive and at most 31 days. Only slots after `after` are returned; when the business
        has `policies.nextAvailableOnly`, only the earliest of them (every other day has no slots) and
        `nextAvailableOnly: true`.
        Rate limit: 120 requests per minute per IP. Auth is optional (draft preview).
      security:
        - {}
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ServiceIdQueryRequired'
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - $ref: '#/components/parameters/OptionIdQuery'
        - $ref: '#/components/parameters/AddonIdsQuery'
        - $ref: '#/components/parameters/GroupIdQuery'
        - name: resourceId
          in: query
          required: false
          description: The customer's choice for the service's customer-selectable requirement.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AfterQuery'
      responses:
        '200':
          description: Availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/public/businesses/{slug}/bookings:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [public]
      operationId: createPublicBooking
      summary: Book a service (customer)
      description: |
        Creates a booking. Auth is optional. A signed-in caller is recorded as the actor and may be linked to the customer record.
        Status is `held` when online payment is due (`next.type = payment_required`, with a `checkoutUrl`),
        `pending_approval` when the service requires approval, and `confirmed` otherwise.
        With an `Idempotency-Key`, repeating the same request returns the original booking with **200** instead of 201
        (`next.type` is `expired` or `cancelled` if that booking has since expired unpaid or been cancelled).
        Reusing the key for a different service/start gives 409 `CONFLICT`.
        Rate limit: 20 requests per 10 minutes per IP.
      security:
        - {}
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePublicBooking' }
      responses:
        '201':
          description: Booking created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingResult' }
        '200':
          description: Idempotent replay. The original result for this `Idempotency-Key`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `SLOT_UNAVAILABLE` (the time is taken), `PRICE_CHANGED` (it no longer costs `expectedTotalCents`),
            `POLICY_VIOLATION` (the service is restricted to other customer groups),
            `PLAN_LIMIT_REACHED` (the business hit its monthly Free-plan limit), `PAYMENTS_NOT_CONFIGURED`,
            or `CONFLICT` (the `Idempotency-Key` was reused for a different request).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ manage (guest)
  /v1/public/manage/{token}:
    parameters:
      - $ref: '#/components/parameters/ManageToken'
    get:
      tags: [manage]
      operationId: getManagedBooking
      summary: View a booking by manage token
      security: []
      responses:
        '200':
          description: The booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedBooking' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/public/manage/{token}/cancel:
    parameters:
      - $ref: '#/components/parameters/ManageToken'
    post:
      tags: [manage]
      operationId: cancelManagedBooking
      summary: Cancel a booking (guest)
      description: |
        Cancels under the business's policy, including any refund. The body is optional.
        Rate limit: 30 requests per 10 minutes per IP.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200':
          description: The updated booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedBooking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/public/manage/{token}/reschedule:
    parameters:
      - $ref: '#/components/parameters/ManageToken'
    post:
      tags: [manage]
      operationId: rescheduleManagedBooking
      summary: Move a booking (guest)
      description: |
        Allowed while `canReschedule` is true. Otherwise the response is 409 `POLICY_VIOLATION`.
        Rate limit: 30 requests per 10 minutes per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRescheduleInput' }
      responses:
        '200':
          description: The updated booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedBooking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/public/manage/{token}/availability:
    parameters:
      - $ref: '#/components/parameters/ManageToken'
    get:
      tags: [manage]
      operationId: getManagedBookingAvailability
      summary: Slots for moving this booking
      description: |
        Returns availability for the booking's service, keeping its current duration and ignoring the booking itself.
        The range is at most 31 days. `after` and `policies.nextAvailableOnly` apply as on the public availability.
        Rate limit: 120 requests per minute per IP.
      security: []
      parameters:
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - name: resourceId
          in: query
          required: false
          description: The customer's choice for the customer-selectable requirement.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AfterQuery'
      responses:
        '200':
          description: Availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/public/manage/{token}/pay:
    parameters:
      - $ref: '#/components/parameters/ManageToken'
    post:
      tags: [manage]
      operationId: payManagedBooking
      summary: Get the checkout URL for a held booking
      description: |
        Only works while the booking is `held` and its hold has not expired. Otherwise the response is 409 `POLICY_VIOLATION`.
        No request body. Rate limit: 30 requests per 10 minutes per IP.
      security: []
      responses:
        '200':
          description: Checkout URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutUrlResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ dev payments
  /v1/public/dev-payments/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    get:
      tags: [dev-payments]
      operationId: getDevPayment
      summary: View a dev-provider checkout
      description: Only available with the `dev` payment provider outside production. Otherwise the response is 404.
      security: []
      responses:
        '200':
          description: Payment, booking and business.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevPaymentView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/public/dev-payments/{paymentId}/complete:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    post:
      tags: [dev-payments]
      operationId: completeDevPayment
      summary: Complete or cancel a dev-provider checkout
      description: Only available with the `dev` payment provider outside production. Otherwise the response is 404.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevPaymentOutcome' }
      responses:
        '200':
          description: Where to send the customer next (`{base}/manage/{token}?payment={outcome}`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedirectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ webhooks
  /v1/webhooks/stripe:
    post:
      tags: [webhooks]
      operationId: stripeWebhook
      summary: Stripe webhook (platform and Connect events)
      description: |
        The raw body is verified against the `Stripe-Signature` header with `STRIPE_WEBHOOK_SECRET` and
        `STRIPE_CONNECT_WEBHOOK_SECRET` (either may match; 5-minute tolerance). New events are stored in
        `provider_events` and processed by the job queue exactly once; replays answer 200 with `duplicate: true`.
        Handled types: `checkout.session.completed`, `checkout.session.async_payment_succeeded`,
        `checkout.session.async_payment_failed`, `checkout.session.expired`, `charge.refunded`, `account.updated`,
        `customer.subscription.created|updated|deleted`, `invoice.payment_failed`. Other types are acknowledged and ignored.
      security: []
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A Stripe event object. }
      responses:
        '200':
          description: Accepted (or already received).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAck' }
        '400':
          description: '`INVALID_SIGNATURE` (bad, missing or expired signature) or `INVALID_REQUEST` (not a Stripe event).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: '`WEBHOOKS_NOT_CONFIGURED`: no Stripe webhook secret is set.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/webhooks/clerk:
    post:
      tags: [webhooks]
      operationId: clerkWebhook
      summary: Clerk user webhook (Svix)
      description: |
        Verified with the Svix headers (HMAC-SHA256 with `CLERK_WEBHOOK_SECRET`, 5-minute timestamp tolerance).
        `user.created` / `user.updated` upsert the user. `user.deleted` anonymises the user, unlinks their customer
        records and removes their memberships; a business whose last owner is deleted is suspended.
        Replays (same `svix-id`) answer 200 with `duplicate: true`.
      security: []
      parameters:
        - { in: header, name: svix-id, required: true, schema: { type: string } }
        - { in: header, name: svix-timestamp, required: true, schema: { type: string } }
        - { in: header, name: svix-signature, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A Clerk webhook event. }
      responses:
        '200':
          description: Applied (or already received).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAck' }
        '400':
          description: '`INVALID_SIGNATURE` or `INVALID_REQUEST`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: '`WEBHOOKS_NOT_CONFIGURED`: `CLERK_WEBHOOK_SECRET` is not set.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/mcp:
    post:
      tags: [public]
      operationId: mcp
      summary: Model Context Protocol endpoint (Streamable HTTP, stateless)
      description: |
        JSON-RPC 2.0 messages per the MCP Streamable HTTP transport (send `Accept: application/json, text/event-stream`).
        Stateless: no `Mcp-Session-Id`, every POST is answered with a JSON body. Anonymous and read-only: tools
        `search_marketplace`, `find_business`, `list_services` and `check_availability`. Booking, rescheduling and cancelling
        need the signed-in customer server (`/v1/mcp/customer`, OAuth). Arguments are decoded strictly.
        Tool failures are returned as results with `isError: true` and text `"<ERROR_CODE>: <message>"`.
        Rate limit: 120 requests per minute per IP. GET and DELETE return 405.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A JSON-RPC request, notification or batch. }
      responses:
        '200':
          description: JSON-RPC response.
          content:
            application/json:
              schema: { type: object }
        '202':
          description: Accepted (notifications only).
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [public]
      operationId: mcpGet
      summary: Not supported (the server is stateless and never streams)
      security: []
      responses:
        '405': { description: Method not allowed. }
    delete:
      tags: [public]
      operationId: mcpDelete
      summary: Not supported (there are no sessions to end)
      security: []
      responses:
        '405': { description: Method not allowed. }

  /v1/dev/emails:
    get:
      tags: [dev]
      operationId: listEmailPreviews
      summary: Email template previews (development only)
      security: []
      responses:
        '200':
          description: HTML index of all templates.
          content:
            text/html:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/dev/emails/{template}:
    get:
      tags: [dev]
      operationId: previewEmail
      summary: Render one email template with sample data (development only)
      security: []
      parameters:
        - in: path
          name: template
          required: true
          schema:
            type: string
            enum: [booking_confirmed, booking_pending_approval, booking_approved, booking_declined, booking_cancelled,
              booking_rescheduled, booking_reminder, payment_requested, payment_refunded, payment_refunded_apology,
              team_invitation, new_booking_for_business]
        - in: query
          name: format
          required: false
          schema: { type: string, enum: [html, text] }
      responses:
        '200':
          description: The rendered email.
          content:
            text/html:
              schema: { type: string }
            text/plain:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ me
  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in user
      description: |
        Also auto-accepts invitations for the user's verified email. Invitations that are still pending, for
        example because of a plan member limit, are listed in `pendingInvitations`. Customer records whose
        email matches the user's verified email are linked when the user signs in (or the email changes or is
        verified) and by `GET /v1/me/bookings`.
      responses:
        '200':
          description: The user, memberships and pending invitations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/me/bookings:
    get:
      tags: [me]
      operationId: listMyBookings
      summary: The signed-in user's bookings across businesses
      description: |
        Excludes `expired` bookings.
        `upcoming` holds every booking with status held/pending_approval/confirmed that ends in the future, sorted by start ascending.
        `past` holds the latest 100 of the rest, sorted by start descending.
      responses:
        '200':
          description: Bookings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyBookings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/me/bookings/{bookingId}/cancel:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [me]
      operationId: cancelMyBooking
      summary: Cancel one of my bookings
      description: Cancels under the business's policy. The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200':
          description: The updated booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerBooking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/me/bookings/{bookingId}/reschedule:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [me]
      operationId: rescheduleMyBooking
      summary: Move one of my bookings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRescheduleInput' }
      responses:
        '200':
          description: The updated booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerBooking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/me/bookings/{bookingId}/availability:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [me]
      operationId: getMyBookingAvailability
      summary: Slots for moving one of my bookings
      description: |
        Same as `GET /v1/public/manage/{token}/availability` for a booking of the signed-in customer: the booking's service,
        its current duration and its customer group, with customer rules (minimum notice, maximum advance), ignoring the
        booking's own allocations (so overlapping its current time is allowed). The range is at most 31 days. `after` and
        `policies.nextAvailableOnly` apply as on the public availability.
        Another user's booking returns 404. Rate limit: 120 requests per minute per IP.
      parameters:
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - name: resourceId
          in: query
          required: false
          description: The customer's choice for the customer-selectable requirement.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AfterQuery'
      responses:
        '200':
          description: Availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/me/bookings/{bookingId}/pay:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [me]
      operationId: payMyBooking
      summary: Get the checkout URL for one of my held bookings
      description: |
        Only works while the booking is `held` and its hold has not expired. Otherwise the response is 409 `POLICY_VIOLATION`.
        Another user's booking returns 404. No request body.
      responses:
        '200':
          description: Checkout URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutUrlResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      tags: [me]
      operationId: acceptInvitation
      summary: Accept a team invitation
      description: |
        Returns 409 `CONFLICT` if the caller is already a member through another invitation, or 409 `PLAN_LIMIT_REACHED` if the Free plan's member limit is reached.
        Accepting again is a 200 for the user who joined through this invitation (`GET /v1/me` accepts invitations for the verified email at sign-in, often before the link is opened); for anyone else a used invitation is 404.
        No request body.
      responses:
        '200':
          description: The refreshed `Me`, and the business joined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedInvitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ onboarding / AI
  /v1/businesses:
    post:
      tags: [onboarding]
      operationId: createBusiness
      summary: Create a business from a setup
      description: |
        Any signed-in user can create a business and becomes its owner. The new business is created with status `active`.
        If `slug` is omitted, a free slug derived from the name is chosen. If the given slug is taken, the response is 409 `SLUG_TAKEN`
        with `fields.slug` suggesting an alternative. Rate limit: 10 requests per hour per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessSetupInput' }
      responses:
        '201':
          description: The created business (`myRole` = `owner`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/slug-available:
    get:
      tags: [onboarding]
      operationId: checkSlugAvailability
      summary: Check whether a slug is free
      description: The slug is trimmed and lowercased first. If it is reserved, malformed or taken, `suggestion` holds a free alternative.
      parameters:
        - name: slug
          in: query
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlugAvailability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/ai/business-draft:
    post:
      tags: [onboarding]
      operationId: createBusinessDraft
      summary: Draft a business setup from a description
      description: |
        Returns a reviewable `BusinessSetup` without creating anything. With `ANTHROPIC_API_KEY` set the draft is
        generated by Claude with structured outputs (`source: "ai"`), repaired and validated like user input; if
        `websiteUrl` is given the page is fetched server-side (public http/https only) as context. Without a key, or
        when the model refuses, is truncated, errors or returns an invalid setup, the best-matching template is
        returned (`source: "template"`). The model call is recorded in the AI usage ledger against the user (no business
        exists yet, so no credit allowance applies). Rate limit: 20 requests per hour per IP, and 20 per hour per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessDraftRequest' }
      responses:
        '200':
          description: The draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessSetup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ business settings
  /v1/businesses/{businessId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [business]
      operationId: getBusiness
      summary: Get the business
      description: |
        Minimum role: **staff**. `businessId` may also be the business's slug (the dashboard asks by the slug in its URL
        while `/v1/me` is still loading); a value shaped like a UUID is an id (slugs never are). An unknown slug is 404,
        like a business you are not a member of.
      parameters:
        - name: businessId
          in: path
          required: true
          description: The business's id, or its slug.
          schema: { type: string }
      responses:
        '200':
          description: The business.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [business]
      operationId: updateBusiness
      summary: Update business settings
      description: |
        Minimum role: **admin**. Partial update (see `UpdateBusiness`).
        Returns 400 `INVALID_TIMEZONE` when the timezone is the only invalid field, and 409 `SLUG_TAKEN` (with a suggestion in `fields.slug`)
        when the new slug belongs to another business.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBusiness' }
      responses:
        '200':
          description: The updated business.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [business]
      operationId: deleteBusiness
      summary: Delete (suspend) the business
      description: 'Minimum role: **owner**. This is a soft delete: status becomes `suspended` and the business disappears from every route. Refused with 409 `CONFLICT` while a paid plan is still billing (active, trialing or past due): cancel it in the billing portal first.'
      responses:
        '204': { description: 'Deleted.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/overview:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [business]
      operationId: getOverview
      summary: Dashboard overview
      description: |
        Minimum role: **staff**. Staff scoping: `today`, `upcomingCount7d` and `bookings30d` only count bookings on the caller's
        linked resources, and `revenueCents30d` is always 0 for staff.
      responses:
        '200':
          description: Overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ customer groups
  /v1/businesses/{businessId}/customer-groups:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [customer-groups]
      operationId: listCustomerGroups
      summary: List customer groups
      description: 'Minimum role: **staff**. Includes inactive groups.'
      responses:
        '200':
          description: Groups.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [customer-groups]
      operationId: createCustomerGroup
      summary: Create a customer group
      description: 'Minimum role: **admin**.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerGroupInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/customer-groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/GroupId'
    patch:
      tags: [customer-groups]
      operationId: updateCustomerGroup
      summary: Update a customer group
      description: 'Minimum role: **admin**. Partial update.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerGroupUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [customer-groups]
      operationId: deleteCustomerGroup
      summary: Delete a customer group
      description: |
        Minimum role: **admin**. If the group is referenced by bookings, availability audiences or service restrictions,
        it is deactivated (`isActive: false`) instead of being deleted.
      responses:
        '204': { description: 'Deleted or deactivated.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ questions
  /v1/businesses/{businessId}/questions:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [questions]
      operationId: listQuestions
      summary: List booking form questions
      description: 'Minimum role: **staff**. Includes inactive questions.'
      responses:
        '200':
          description: Questions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FormQuestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [questions]
      operationId: createQuestion
      summary: Create a question
      description: 'Minimum role: **admin**.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormQuestionInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormQuestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/QuestionId'
    patch:
      tags: [questions]
      operationId: updateQuestion
      summary: Update a question
      description: 'Minimum role: **admin**. Partial update.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormQuestionUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormQuestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [questions]
      operationId: deleteQuestion
      summary: Delete a question
      description: 'Minimum role: **admin**. Answers already stored on bookings are kept, because bookings snapshot them.'
      responses:
        '204': { description: 'Deleted.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ resources
  /v1/businesses/{businessId}/resources:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [resources]
      operationId: listResources
      summary: List resources
      description: 'Minimum role: **staff**. Staff scoping: staff only receive the resources linked to them. Includes inactive resources.'
      responses:
        '200':
          description: Resources.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [resources]
      operationId: createResource
      summary: Create a resource
      description: 'Minimum role: **admin**.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/resources/{resourceId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/ResourceId'
    patch:
      tags: [resources]
      operationId: updateResource
      summary: Update a resource
      description: 'Minimum role: **admin**. Partial update.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [resources]
      operationId: deleteResource
      summary: Delete a resource
      description: 'Minimum role: **admin**. If the resource has bookings, it is deactivated instead of being deleted.'
      responses:
        '204': { description: 'Deleted or deactivated.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ availability settings
  /v1/businesses/{businessId}/resources/{resourceId}/availability:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [availability]
      operationId: getResourceAvailability
      summary: Weekly rules and date overrides of a resource
      description: |
        Minimum role: **staff**. Staff scoping: staff may only read resources linked to them (403 otherwise).
        Returns all of the resource's weekly rules, plus its overrides dated on or after `from`.
      parameters:
        - name: from
          in: query
          required: false
          description: Only return overrides on or after this date. Defaults to 30 days before today in the business timezone.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Rules and overrides.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceAvailability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/resources/{resourceId}/rules:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [availability]
      operationId: replaceResourceRules
      summary: Replace the weekly availability rules of a resource
      description: |
        Minimum role: **staff**. Staff scoping: staff may only edit resources linked to them (403 otherwise).
        Replaces the whole weekly set, up to 100 rules.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceRulesInput' }
      responses:
        '200':
          description: The new rules.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityRulesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/resources/{resourceId}/overrides:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [availability]
      operationId: createResourceOverride
      summary: Add a date override for a resource
      description: |
        Minimum role: **staff**. Staff scoping: staff may only edit resources linked to them (403 otherwise).
        `isAvailable: false` without times blocks the whole day, and with times blocks that window.
        `isAvailable: true` requires `startTime` and `endTime` and adds extra availability.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityOverrideInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityOverride' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/overrides/{overrideId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/OverrideId'
    delete:
      tags: [availability]
      operationId: deleteOverride
      summary: Delete a resource override or business closure
      description: |
        Minimum role: **staff**. Staff scoping: staff may only delete overrides of resources linked to them.
        Deleting a business-wide closure (`resourceId: null`) requires **admin**.
      responses:
        '204': { description: 'Deleted.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/closures:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [availability]
      operationId: listClosures
      summary: List business-wide closures
      description: 'Minimum role: **staff**. Closures are overrides with `resourceId: null`.'
      parameters:
        - name: from
          in: query
          required: false
          description: Only return closures on or after this date. Defaults to 30 days before today in the business timezone.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Closures.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AvailabilityOverride' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [availability]
      operationId: createClosure
      summary: Add a business-wide closure
      description: 'Minimum role: **admin**. `isAvailable` must be `false`. Times are optional: without them the whole day is closed.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityOverrideInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityOverride' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ services
  /v1/businesses/{businessId}/services:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [services]
      operationId: listServices
      summary: List services
      description: 'Minimum role: **staff**. Includes inactive and private services.'
      responses:
        '200':
          description: Services.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Service' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [services]
      operationId: createService
      summary: Create a service
      description: 'Minimum role: **admin**.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/services/{serviceId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/ServiceId'
    put:
      tags: [services]
      operationId: replaceService
      summary: Replace a service
      description: |
        Minimum role: **admin**. Full replacement, including options, add-ons and requirements.
        Each option, add-on or requirement input item is matched to an existing item by `id`, or else by name/label
        (case-insensitive). A matched item is updated in place and keeps its id. Unmatched items are created, and existing
        items that nothing matched are removed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [services]
      operationId: deleteService
      summary: Delete a service
      description: 'Minimum role: **admin**. If the service has bookings, it is deactivated instead of being deleted.'
      responses:
        '204': { description: 'Deleted or deactivated.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ staff bookings
  /v1/businesses/{businessId}/bookings:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [bookings]
      operationId: listBookings
      summary: List bookings
      description: |
        Minimum role: **staff**. Staff scoping: staff only see bookings allocated to their linked resources.
        A `resourceId` filter from staff is intersected with their own resources.
        Results are ordered by start ascending. `expired` bookings are excluded unless `status` is given.
        If both `from` and `to` are given, `to` must be on or after `from`, and the range can be at most 366 days.
      parameters:
        - name: from
          in: query
          required: false
          description: Bookings starting on or after this date, in the business timezone.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Bookings starting on or before this date, inclusive.
          schema: { type: string, format: date }
        - name: status
          in: query
          required: false
          description: Comma-separated `BookingStatus` values.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/BookingStatus' }
        - name: resourceId
          in: query
          required: false
          description: Comma-separated resource ids. Matches bookings allocated to any of them.
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: serviceId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: customerId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on reference, customer name, email or phone. Truncated to 100 characters.
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of bookings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [bookings]
      operationId: createBooking
      summary: Create a booking (dashboard)
      description: |
        Minimum role: **staff**. Staff scoping: staff may only book onto their own resources. Without `resourceIds`,
        staff bookings are forced onto their linked resources (403 otherwise).
        Staff bookings skip minimum notice and maximum advance checks, and required questions are not enforced.
        Give either `customerId` or `customer`.
        With `paymentMode: collect_online` (and a price above zero) the booking is `held` until the customer pays: the
        response's `checkoutUrl` is the payment link, and with `notifyCustomer` the customer is emailed it
        (`payment_requested`) when they have an email address. Otherwise `checkoutUrl` is `null`.
        With an `Idempotency-Key`, repeating the same request returns the original booking with **200** instead of 201
        (`next.type` is `expired` or `cancelled` if that booking has since expired unpaid or been cancelled).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStaffBooking' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedBooking' }
        '200':
          description: Idempotent replay. The original booking for this `Idempotency-Key`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedBooking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SLOT_UNAVAILABLE`, `POLICY_VIOLATION`, `PLAN_LIMIT_REACHED`, `PAYMENTS_NOT_CONFIGURED` (for `collect_online`), or `CONFLICT`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/bookings/{bookingId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [bookings]
      operationId: getBooking
      summary: Booking detail with payments and audit history
      description: 'Minimum role: **staff**. Staff scoping: bookings not on the caller''s linked resources return 404.'
      responses:
        '200':
          description: The booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [bookings]
      operationId: updateBooking
      summary: Update notes and answers of a booking
      description: 'Minimum role: **staff**. Staff scoping: bookings not on the caller''s linked resources return 404. Partial update.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingUpdate' }
      responses:
        '200':
          description: The updated booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/bookings/{bookingId}/cancel:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [bookings]
      operationId: cancelBooking
      summary: Cancel a booking (business)
      description: 'Minimum role: **staff**. Staff scoping: bookings not on the caller''s linked resources return 404. The body is optional.'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCancelInput' }
      responses:
        '200':
          description: The updated booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/bookings/{bookingId}/reschedule:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [bookings]
      operationId: rescheduleBooking
      summary: Move a booking (business)
      description: |
        Minimum role: **staff**. Staff scoping: bookings not on the caller's linked resources return 404.
        Staff may only pick their own resources (403 otherwise). Without `resourceIds`, staff keep the current resources.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffRescheduleInput' }
      responses:
        '200':
          description: The updated booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/bookings/{bookingId}/approve:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [bookings]
      operationId: approveBooking
      summary: Approve a pending booking
      description: 'Minimum role: **staff**. Staff scoping: bookings not on the caller''s linked resources return 404. No request body.'
      responses:
        '200':
          description: The updated booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/bookings/{bookingId}/decline:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [bookings]
      operationId: declineBooking
      summary: Decline a pending booking
      description: |
        Minimum role: **staff**. Staff scoping: bookings not on the caller's linked resources return 404. The body is optional.
        The booking is cancelled by the business with a full refund of anything paid. `reason` is stored as
        `cancellationReason` and quoted in the `booking_declined` email to the customer.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200':
          description: The updated booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/bookings/{bookingId}/send-payment-link:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [bookings]
      operationId: sendBookingPaymentLink
      summary: Email the payment link of a held booking to the customer
      description: |
        Minimum role: **staff**. Staff scoping: bookings not on the caller's linked resources return 404. No request body.
        Enqueues the `payment_requested` email with the booking's checkout link and records the audit event
        `booking.payment_link_sent`. 409 `POLICY_VIOLATION` when the booking is not `held` with a valid hold, or the
        customer has no email address (share `BookingDetail.checkoutUrl` another way).
      responses:
        '200':
          description: The link that was sent and its recipient.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentLinkSent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/bookings/{bookingId}/paid-in-person:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [bookings]
      operationId: markBookingPaidInPerson
      summary: Record that what was due at the venue was paid in person
      description: |
        Minimum role: **staff**. Staff scoping: bookings not on the caller's linked resources return 404. No request body.
        For a `confirmed` or `completed` booking that is `pay_at_venue`, or `paid` with a deposit balance left. Records the
        amount still due as a settled `in_person` payment, adds it to `amountPaidCents`, sets `paymentStatus` to `paid` and
        records the audit event `payment.received_in_person`. In-person payments are never refunded online. 409
        `POLICY_VIOLATION` when nothing is due at the venue or the booking is in another status.
      responses:
        '200':
          description: The updated booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/bookings/{bookingId}/status:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [bookings]
      operationId: setBookingStatus
      summary: Mark a booking completed or no-show
      description: |
        Minimum role: **staff**. Staff scoping: bookings not on the caller's linked resources return 404.
        Only works for bookings that have started and are confirmed/completed/no_show. Otherwise the response is 409 `POLICY_VIOLATION`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingStatusInput' }
      responses:
        '200':
          description: The updated booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/availability:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [bookings]
      operationId: getStaffAvailability
      summary: Slots for dashboard booking
      description: |
        Minimum role: **staff**. Staff scoping: availability is limited to the caller's linked resources, intersected with any
        `resourceId` filter. Returns 403 if nothing remains.
        With `includePrivate=true` (the default), staff rules apply: no minimum notice or maximum advance, and private services are allowed.
        With `false`, the public rules apply and a non-public service returns 404. The range is at most 31 days.

        **Rescheduling** (`excludeBookingId`): returns the times that booking can be moved to with
        `POST /bookings/{id}/reschedule`. The booking must be visible to the caller (404 otherwise, including bookings of
        other businesses). Its own allocations are ignored, so times overlapping its current slot are offered; the
        booking's service, duration and customer group are used (`optionId`, `addonIds`, `groupId` and `includePrivate`
        are ignored; staff rules apply). `serviceId` may be omitted; if given it must be the booking's service (400).
        `resourceId` pins resources as in reschedule; staff members without `resourceId` keep the booking's current resources.
      parameters:
        - name: serviceId
          in: query
          required: false
          description: Required unless `excludeBookingId` is given.
          schema: { type: string, format: uuid }
        - name: excludeBookingId
          in: query
          required: false
          description: A booking being rescheduled; see above.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - $ref: '#/components/parameters/OptionIdQuery'
        - $ref: '#/components/parameters/AddonIdsQuery'
        - $ref: '#/components/parameters/GroupIdQuery'
        - name: resourceId
          in: query
          required: false
          description: Comma-separated resource ids to force. Each must belong to one of the service's requirement pools.
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: includePrivate
          in: query
          required: false
          description: '`true`/`1` or `false`/`0`.'
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ customers
  /v1/businesses/{businessId}/customers:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [customers]
      operationId: listCustomers
      summary: List customers
      description: |
        Minimum role: **staff**. Staff scoping: staff only see customers who have bookings on their linked resources,
        plus customers with no bookings at all. Results are ordered by name (case-insensitive). Erased customers are excluded.
      parameters:
        - name: q
          in: query
          required: false
          description: Search on name, email or phone. Truncated to 100 characters.
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of customers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Create a customer
      description: 'Minimum role: **staff**. Returns 409 `CONFLICT` if another customer already has this email.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Customer detail with bookings
      description: |
        Minimum role: **staff**. Staff scoping: a customer who has bookings, but none on the caller's resources, returns 404.
        `bookings` only includes bookings on their resources. Bookings are ordered by start descending, with expired ones excluded.
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [customers]
      operationId: updateCustomer
      summary: Update a customer
      description: |
        Minimum role: **staff**. Staff scoping: a customer who has bookings, but none on the caller's resources, returns 404. Partial update.
        Changing the email of a customer linked to a user account unlinks the account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [customers]
      operationId: eraseCustomer
      summary: Erase a customer (GDPR)
      description: 'Minimum role: **admin**. Anonymises personal data. The erased customer no longer appears in any route.'
      responses:
        '204': { description: 'Erased.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/customers/{customerId}/export:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [customers]
      operationId: exportCustomer
      summary: Export a customer's data (GDPR)
      description: 'Minimum role: **admin**. The response is sent as an attachment and the export is recorded in the audit log.'
      responses:
        '200':
          description: The export.
          headers:
            Content-Disposition:
              description: '`attachment; filename="customer-{customerId}.json"`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerExport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ team
  /v1/businesses/{businessId}/team:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [team]
      operationId: listTeam
      summary: List team members and pending invitations
      description: 'Minimum role: **staff**. Removed members are excluded.'
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/team/invitations:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [team]
      operationId: inviteTeamMember
      summary: Invite a team member
      description: |
        Minimum role: **admin**. Only an owner can invite another owner (403 otherwise).
        Returns 409 `CONFLICT` if the email is already a member or has a pending invitation, and 409 `PLAN_LIMIT_REACHED` on the Free plan
        when 3 seats (active plus invited) are already used. Sends an invitation email.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationInput' }
      responses:
        '201':
          description: 'The invited member (`status: invited`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/team/{memberId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/MemberId'
    patch:
      tags: [team]
      operationId: updateTeamMember
      summary: Change a member's role or linked resource
      description: |
        Minimum role: **admin**. Only an owner can change owner roles (403 otherwise).
        Demoting the last active owner returns 409 `POLICY_VIOLATION`. Partial update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamMemberUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [team]
      operationId: removeTeamMember
      summary: Remove a member or revoke an invitation
      description: |
        Minimum role: **admin**. Only an owner can remove an owner (403 otherwise).
        Removing the last active owner returns 409 `POLICY_VIOLATION`. Linked resources are unlinked.
      responses:
        '204': { description: 'Removed.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ reports
  /v1/businesses/{businessId}/reports/summary:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [reports]
      operationId: getReportSummary
      summary: Bookings, revenue and utilisation summary
      description: |
        Minimum role: **admin**. Covers bookings starting from `from` to `to` inclusive, in the business timezone,
        for a range of at most 366 days.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/audit:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [reports]
      operationId: listAuditEvents
      summary: Audit log
      description: 'Minimum role: **admin**. Newest first.'
      parameters:
        - name: entityId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of audit events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ payments / billing
  /v1/businesses/{businessId}/payments/status:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [payments]
      operationId: getPaymentsStatus
      summary: Payment provider connection status
      description: 'Minimum role: **admin**. With Stripe, the connected account is read live and the stored flags are refreshed.'
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentsStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/payments/connect:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [payments]
      operationId: connectPayments
      summary: Start payment account onboarding
      description: |
        Minimum role: **owner**. `returnUrl` must be on the app origin (`APP_BASE_URL`) or an allowed CORS origin.
        With Stripe, the first call creates the business's connected account; the URL is a Stripe-hosted onboarding
        link. Stripe sends the user back to `returnUrl?stripe=return`, or to `returnUrl?stripe=refresh` when the link
        expired (call this endpoint again). With provider `none`, the response is 409 `PAYMENTS_NOT_CONFIGURED`.
        Stripe failures give 502 `PAYMENT_PROVIDER_ERROR`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnUrlInput' }
      responses:
        '200':
          description: The onboarding URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/billing:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [billing]
      operationId: getBilling
      summary: Plan, usage and prices
      description: 'Minimum role: **owner**.'
      responses:
        '200':
          description: Billing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Billing' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/billing/checkout:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [billing]
      operationId: createBillingCheckout
      summary: Start a plan upgrade checkout
      description: |
        Minimum role: **owner**. Creates (once) the business's Stripe billing customer and a Stripe Checkout
        subscription session; Stripe returns to `returnUrl?billing=success` or `?billing=cancelled`. The plan changes
        when the subscription webhook arrives. Returns 409 `PAYMENTS_NOT_CONFIGURED` until Stripe billing is configured,
        409 `CONFLICT` when a subscription already exists (use the portal), 502 `PAYMENT_PROVIDER_ERROR` on Stripe failures.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingCheckoutInput' }
      responses:
        '200':
          description: Checkout URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/billing/portal:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [billing]
      operationId: createBillingPortal
      summary: Open the billing portal
      description: |
        Minimum role: **owner**. Returns 409 `PAYMENTS_NOT_CONFIGURED` until Stripe billing is configured and
        409 `CONFLICT` before the first plan checkout (no billing customer yet).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnUrlInput' }
      responses:
        '200':
          description: Portal URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ site builder (docs/architecture.md section 15)
  /v1/businesses/{businessId}/site:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [site]
      operationId: getSite
      summary: Get the site editor state
      description: |
        Draft and published plans, versions, live context (team, opening hours), AI allowance and which image
        sources are available. A site that was never saved returns the default plan as the draft with
        `draftVersion: null`. Role: admin.
      responses:
        '200':
          description: The site state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [site]
      operationId: saveSite
      summary: Save the draft plan
      description: |
        Validates the plan strictly (unknown fields, themes, section types, variants and patterns are errors with the
        field path relative to the plan, e.g. `sections[2].content.rating`; limits, image rules, references and
        palette contrast as in section 15.4) and saves it as a new draft version (`source: "owner"`) with a change list.
        A plan equal to the current draft creates no version. `baseVersion` (the `draftVersion` the editor started
        from) must match the current draft or the response is 409 `CONFLICT`. Audited as `site.updated`. Role: admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveSiteInput' }
      responses:
        '200':
          description: The site state after saving.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/site/publish:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [site]
      operationId: publishSite
      summary: Publish the draft
      description: |
        The published plan becomes the draft and `branding.primaryColor` is set to the palette's primary colour.
        A never-saved site first saves the default plan as version 1 (`source: "template"`). Publishing the version
        that is already published changes nothing. Audited as `site.published`. Role: admin.
      responses:
        '200':
          description: The site state after publishing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/site/versions:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [site]
      operationId: listSiteVersions
      summary: List saved versions (newest first)
      description: 'The newest 50 versions are kept, plus the published one. Role: admin.'
      responses:
        '200':
          description: The versions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteVersionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/site/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/SiteVersionNumber'
    get:
      tags: [site]
      operationId: getSiteVersion
      summary: Get one version with its plan
      description: 'Role: admin.'
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteVersionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/site/versions/{version}/restore:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/SiteVersionNumber'
    post:
      tags: [site]
      operationId: restoreSiteVersion
      summary: Restore a version as a new draft
      description: |
        Copies the version's plan into a new draft version (`source: "restore"`). References to services and people
        that no longer exist (or are no longer active people) and uploads that don't belong to the business are
        dropped first; the result is validated like `PUT /site`. Restoring a plan equal to the draft creates nothing.
        Used for "Undo" after an AI change (`previousVersion`). Audited as `site.restored`. Role: admin.
      responses:
        '200':
          description: The site state after restoring.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/site/generate:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [site]
      operationId: generateSite
      summary: Generate a new draft with AI
      description: |
        With `ANTHROPIC_API_KEY` the model picks the theme, sections, order and copy from the business's services,
        team, vocabulary, policies and hours (never form questions, answers or customer data) plus the optional
        prompt and website text (fetched server-side with SSRF protection). The output is repaired (claims removed,
        invented service/team ids and testimonials dropped, colours made readable, owner images and testimonials
        carried over) and validated like `PUT /site`, then saved as a new version (`source: "ai_generate"`).
        Without a key, or on refusal, truncation, errors or invalid output, the deterministic generator is used
        (`source: "template"`, version source `template`, `message` explains). A result equal to the draft creates
        no version. With a model, the call is metered in AI credits (feature `site_generate`, checked before the
        model is called: 409 `AI_LIMIT_REACHED`); the built-in generator is free. Rate limit 60 per hour per IP
        (shared with edits). Audited as `site.generated` (actor `ai`). Role: admin. The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateSiteInput' }
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteAiResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/site/edit:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [site]
      operationId: editSite
      summary: Change the draft with a conversational instruction
      description: |
        The model receives the current draft (without images or testimonial items) and the instruction and returns a
        full revised plan, repaired and validated like `generate`, saved as `source: "ai_edit"`. Without a key or on
        failure a rule-based editor applies theme names and mood words ("warmer", "more professional"), "move X
        higher/lower/to the top/to the bottom/above Y", "hide/show X", "add a FAQ about Y" and
        `headline to "…"` (`source: "template"` in the result; the version source is still `ai_edit`). An edit that
        changes nothing creates no version, is not metered and `message` says what the editor understands.
        `baseVersion` must match the draft (409 `CONFLICT`, also when the draft changed while the model ran).
        With a model, metered in AI credits (feature `site_edit`; 409 `AI_LIMIT_REACHED` when used up). Audited as
        `site.edited` (actor `ai`). Role: admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditSiteInput' }
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteAiResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/site/stock:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [site]
      operationId: searchStockPhotos
      summary: Search stock photos (Unsplash)
      description: |
        Landscape photos from Unsplash (`content_filter=high`, 24 per page). Without `UNSPLASH_ACCESS_KEY` the response
        is `{"enabled": false, "results": []}` and `q` is not required. Use the photo's `url` and `attribution` in a
        `stock` image and call `POST /site/stock/download` when it is chosen. Rate limit 120 searches per hour per IP.
        Role: admin.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 1 }
      responses:
        '200':
          description: The photos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockSearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/site/stock/download:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [site]
      operationId: trackStockDownload
      summary: Report that a stock photo was chosen
      description: |
        Unsplash download tracking. `downloadLocation` must start with `https://api.unsplash.com/photos/`. Best effort:
        204 even when Unsplash can't be reached, and a no-op without a key. Role: admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockDownloadInput' }
      responses:
        '204': { description: Recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/businesses/{businessId}/uploads:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [uploads]
      operationId: uploadImage
      summary: Upload an image
      description: |
        `multipart/form-data` with the image in the field `file`. PNG, JPEG or WebP, detected from the bytes (the
        declared type and file name are ignored), at most 5 MB (5 242 880 bytes) and 6000 px per side (read from the
        header before decoding). PNG and JPEG must decode. Metadata is stripped (JPEG APP1–APP15 except ICC profiles,
        and comments; PNG text, time and EXIF chunks; WebP EXIF and XMP). Stored as `businesses/{businessId}/{uuid}.{ext}`
        and returned with its public URL (`${APP_BASE_URL}/api/v1/public/uploads/{businessId}/{file}` on local disk,
        `${STORAGE_PUBLIC_BASE_URL}/businesses/{businessId}/{file}` on S3). Rejections are 400 `INVALID_REQUEST` with
        `fields.file`. Rate limit 60 per hour per IP. Audited as `upload.created`. Role: admin.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: The stored image.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503':
          description: '`UPLOADS_NOT_CONFIGURED` (no image storage on this server) or `DATABASE_UNAVAILABLE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/public/uploads/{businessId}/{file}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - name: file
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-f-]{36}\.(png|jpg|webp)$' }
    get:
      tags: [uploads]
      operationId: getUploadedImage
      summary: Serve an uploaded image (local disk storage)
      description: |
        Only for local disk storage (S3 files are served by the bucket or CDN). Any other file name is 404.
        Headers: the image `Content-Type`, `Cache-Control: public, max-age=31536000, immutable`,
        `X-Content-Type-Options: nosniff` and `Content-Security-Policy: default-src 'none'`.
      security:
        - {}
      responses:
        '200':
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ AI usage (section 16)
  /v1/businesses/{businessId}/ai/usage:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [ai]
      operationId: getAiUsage
      summary: This month's AI credits, per-feature usage and a daily series
      description: |
        Every model call (business draft, site generation and edits, Bo) is reserved before it runs and settled with
        the provider's token counts, costed from the versioned price table. Credits are derived from that cost at a
        configured credit value; each plan's monthly credits (calendar month in the business timezone) are deployment
        configuration. A call may start while less than the allowance is committed (settled cost plus
        in-flight reservations); after that AI requests answer 409 `AI_LIMIT_REACHED`, unless metered overage is on
        for the business (`credits.overage`). Role: admin.
      responses:
        '200':
          description: Usage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiUsage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ Bo, the assistant (section 17)
  /v1/businesses/{businessId}/assistant:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [assistant]
      operationId: getAssistant
      summary: Bo's state
      description: |
        Whether a model is configured (without one Bo still opens with nudges and quick actions, but cannot chat),
        the business's AI credits, the member's recent conversations and, for owners and admins, the nudges
        (deterministic checks refreshed here and every 15 minutes). Role: staff.
      responses:
        '200':
          description: State.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/businesses/{businessId}/assistant/threads:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [assistant]
      operationId: listAssistantThreads
      summary: The member's recent conversations (newest first)
      description: 'Role: staff. Conversations are private to the member who started them.'
      responses:
        '200':
          description: Threads.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssistantThreadSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [assistant]
      operationId: createAssistantThread
      summary: Start a conversation
      description: 'Role: staff. The body is optional; the title is set from the first message when empty.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: [string, 'null'], maxLength: 120 }
      responses:
        '201':
          description: The thread.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantThread' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/businesses/{businessId}/assistant/threads/{threadId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [assistant]
      operationId: getAssistantThread
      summary: A conversation with its messages and proposals
      description: 'Role: staff, own threads only (others: 404).'
      responses:
        '200':
          description: The thread.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantThread' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [assistant]
      operationId: deleteAssistantThread
      summary: Delete a conversation
      description: 'Role: staff, own threads only.'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/businesses/{businessId}/assistant/threads/{threadId}/messages:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [assistant]
      operationId: sendAssistantMessage
      summary: Send a message; the reply streams back as server-sent events
      description: |
        Checks before the stream starts (ordinary JSON errors): the thread is the member's, `text` is 1–2,000
        characters, a model is configured (503 `AI_NOT_CONFIGURED`), credits are left (409 `AI_LIMIT_REACHED`), no
        other turn is running in the thread (409 `CONFLICT`) and the rate limit (60 messages per hour per IP).
        Then `text/event-stream`: each event is `event: <type>` with `data:` the JSON of an `AssistantTurnEvent`
        (`user_message`, `text`, `tool`, `proposal`, `notice`, `error`, `done`). Bo calls tools as the signed-in
        member (their role and calendar apply). Tools that change something never execute here: they return a
        proposal (`proposal` event, a pending `AssistantAction`) that only `POST …/actions/{id}/confirm` carries
        out. Every model call is metered (feature `assistant`). Role: staff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: The turn, streamed.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/AssistantTurnEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: '`AI_NOT_CONFIGURED` (no model on this server) or `DATABASE_UNAVAILABLE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/businesses/{businessId}/assistant/actions/{actionId}/confirm:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [assistant]
      operationId: confirmAssistantAction
      summary: Carry out a proposal
      description: |
        Runs the proposal's command (the same code as the dashboard) as the member, in one transaction with the
        action locked, audited with actor `ai` plus `assistant.action_confirmed`. Idempotent: confirming again returns
        the stored result. A business-rule failure at this point (e.g. the slot was taken meanwhile) returns the
        action with `status: "failed"` and `error`. Expired (30 minutes), declined or failed proposals: 409 `CONFLICT`.
        Only the member who asked may confirm (others: 404). Role: staff, and the tool's own minimum role.
      responses:
        '200':
          description: The action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantAction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/businesses/{businessId}/assistant/actions/{actionId}/reject:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [assistant]
      operationId: rejectAssistantAction
      summary: Decline a proposal
      description: 'Nothing changes; idempotent. Confirmed or failed proposals: 409 `CONFLICT`. Role: staff, own proposals only.'
      responses:
        '200':
          description: The action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantAction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/businesses/{businessId}/agent-requests:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [assistant]
      operationId: listAgentRequests
      summary: My AI apps' proposals here
      description: |
        The proposals the signed-in member's own AI apps (business MCP) made in this business over the last 7 days, newest
        first (at most 50), for them to approve or decline (section 20.8). Only ever the caller's own. Role: staff.
      responses:
        '200':
          description: The proposals.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AgentRequest' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/businesses/{businessId}/agent-requests/{actionId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [assistant]
      operationId: getAgentRequest
      summary: One of my AI apps' proposals
      description: 'The approval page, prepared again so it shows what would happen now. Someone else''s (or Bo''s) proposal: 404. Role: staff.'
      responses:
        '200':
          description: The proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/businesses/{businessId}/agent-requests/{actionId}/approve:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [assistant]
      operationId: approveAgentRequest
      summary: Approve and carry out an AI app's proposal
      description: |
        Carries out the proposal as `confirmAssistantAction` does, audited as actor `ai` via the app with `approvedBy:
        member`. Needs a signed-in session: an app's access token is only valid at the MCP, so an app can't approve its own
        proposal. Idempotent. It is prepared again first: if what would happen changed since it was prepared (a refund, a
        price, the record it edits), the new preview is stored and 409 `CONFLICT` asks the member to check it again (the GET
        shows the current one). Expired, declined or failed, or the app was disconnected since: 409 `CONFLICT`. The business no
        longer lets the member use AI apps: 403. Role: staff, own proposals only (others: 404), and the tool's minimum role.
      responses:
        '200':
          description: The proposal, decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/businesses/{businessId}/agent-requests/{actionId}/decline:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [assistant]
      operationId: declineAgentRequest
      summary: Decline an AI app's proposal
      description: 'Nothing changes; idempotent. Confirmed or failed: 409 `CONFLICT`. Role: staff, own proposals only.'
      responses:
        '200':
          description: The proposal, decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/businesses/{businessId}/assistant/nudges/{nudgeId}/dismiss:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: nudgeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [assistant]
      operationId: dismissNudge
      summary: Dismiss a nudge
      description: 'It stays dismissed until its facts change (e.g. more approvals waiting). Role: admin.'
      responses:
        '204': { description: Dismissed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/businesses/{businessId}/assistant/memory:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [assistant]
      operationId: listAssistantMemory
      summary: The business memory
      description: 'Facts and preferences Bo keeps in mind for the whole team (sent to the model as data). Role: staff.'
      responses:
        '200':
          description: Entries, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemoryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [assistant]
      operationId: addAssistantMemory
      summary: Remember something
      description: 'At most 30 entries of 280 characters (409 `CONFLICT` when full). Audited `assistant.memory_added`. Role: admin.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryInput' }
      responses:
        '201':
          description: The entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/businesses/{businessId}/assistant/memory/{memoryId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: memoryId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [assistant]
      operationId: updateAssistantMemory
      summary: Change a memory entry
      description: 'Role: admin.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryInput' }
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [assistant]
      operationId: deleteAssistantMemory
      summary: Forget a memory entry
      description: 'Role: admin.'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ marketplace (section 18)
  /v1/public/marketplace/meta:
    get:
      tags: [marketplace]
      operationId: getMarketplaceMeta
      summary: Marketplace categories and cities
      description: The controlled category taxonomy and the built-in Irish cities with how many visible listings are within 20 km.
      security: []
      responses:
        '200':
          description: Categories and cities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceMeta' }

  /v1/public/marketplace/search:
    get:
      tags: [marketplace]
      operationId: searchMarketplace
      summary: Search listed businesses
      description: |
        Businesses that list themselves (Pro and Business plans; active; commission-free) matching every given filter.
        With `city` (a slug from `/marketplace/meta`) or `lat`+`lng`, results are within `radiusKm` (city default 20 km, point
        default 25 km, at most 200) and ordered by distance; otherwise by name. `available`/`date` keep only businesses with a
        free time in that window (in the business timezone), checked with the booking engine. Each result carries up to three
        next free times (next 7 days or the filter's window; cached for 30 seconds) with deal prices, and the active deals.
        Keyset pagination: pass `nextCursor` as `cursor` (a cursor only works with the same kind of search).
        Rate limit: 120 requests per minute per IP.
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: 'Name, description, city, service name or a category keyword (at least 2 characters).' }
        - { name: category, in: query, schema: { type: string }, description: Category key. }
        - { name: city, in: query, schema: { type: string }, description: City slug (or name). }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusKm, in: query, schema: { type: number, minimum: 1, maximum: 200 } }
        - { name: available, in: query, schema: { type: string, enum: [today, week] } }
        - { name: date, in: query, schema: { type: string, format: date }, description: Free times on this date. Overrides `available`. }
        - { name: minPrice, in: query, schema: { type: integer, minimum: 0 }, description: 'Cents; a public service''s "from" price (its cheapest option) at least this.' }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: deals, in: query, schema: { type: boolean }, description: Only businesses with an active deal. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 12 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of listings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceSearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/businesses/{businessId}/marketplace:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [marketplace]
      operationId: getMarketplaceSettings
      summary: The business's marketplace listing (admin)
      responses:
        '200':
          description: Listing setting and location status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [marketplace]
      operationId: updateMarketplaceSettings
      summary: List or unlist the business (admin)
      description: |
        Listing needs the Pro or Business plan (409 `PLAN_LIMIT_REACHED` on Free) and enqueues geocoding when the address has
        no location yet. `category` defaults to the category of the business's industry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceSettingsInput' }
      responses:
        '200':
          description: Updated setting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ offers (section 19)
  /v1/public/businesses/{slug}/offers:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [offers]
      operationId: getPublicOffers
      summary: Active deals of a business
      description: Active offers that are not past their end date and not sold out.
      security:
        - {}
        - bearer: []
      responses:
        '200':
          description: Deals.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicOffer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/businesses/{businessId}/offers:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [offers]
      operationId: listOffers
      summary: List offers (admin)
      responses:
        '200':
          description: Offers, oldest first, with redemption counts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Offer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [offers]
      operationId: createOffer
      summary: Create an offer (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/businesses/{businessId}/offers/preview:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    post:
      tags: [offers]
      operationId: previewOffer
      summary: Which slots a draft offer would discount (admin)
      description: Public availability (no customer group, base price or cheapest rules) of the offer's services over `days` days from `from` (default today).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferPreviewInput' }
      responses:
        '200':
          description: Affected slots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/businesses/{businessId}/offers/{offerId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [offers]
      operationId: updateOffer
      summary: Replace an offer (admin)
      description: Bookings keep the price snapshot of the offer they got.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [offers]
      operationId: deleteOffer
      summary: Delete an offer (admin)
      responses:
        '204': { description: Deleted. Bookings keep their price snapshot. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/businesses/{businessId}/offers/{offerId}/pause:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [offers]
      operationId: pauseOffer
      summary: Pause an offer (admin)
      responses:
        '200':
          description: Paused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/businesses/{businessId}/offers/{offerId}/resume:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [offers]
      operationId: resumeOffer
      summary: Resume a paused offer (admin)
      responses:
        '200':
          description: Active again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ Release schedules (section 21)
  /v1/businesses/{businessId}/release-schedules:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [releases]
      operationId: listReleaseSchedules
      summary: List release schedules (admin)
      responses:
        '200':
          description: Every schedule, active and paused, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReleaseSchedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [releases]
      operationId: createReleaseSchedule
      summary: Create a release schedule (admin)
      description: |
        An active schedule closes its services' days to the customers it covers straight away, until each opens. A service and
        customer group can be in only one schedule (an overlap is a field error on `serviceIds`); at most 20 schedules.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseScheduleInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseSchedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/businesses/{businessId}/release-schedules/{scheduleId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [releases]
      operationId: updateReleaseSchedule
      summary: Replace a release schedule (admin)
      description: A new time or cadence never closes a day the old one already opened (a change keeps it open from when it opened).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseScheduleInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseSchedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [releases]
      operationId: deleteReleaseSchedule
      summary: Delete a release schedule (admin)
      responses:
        '204': { description: Deleted. Its days open as if it never existed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/businesses/{businessId}/release-schedules/{scheduleId}/changes/{date}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: date, in: path, required: true, schema: { type: string, format: date } }
    put:
      tags: [releases]
      operationId: changeRelease
      summary: Open one release now, move it or hold it (admin)
      description: The change applies to `date` and (scope `release`) every day the schedule opens at the same moment; days before today are left alone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseChangeInput' }
      responses:
        '200':
          description: The changed days' releases.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Releases' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [releases]
      operationId: resetRelease
      summary: Put one release back on schedule (admin)
      parameters:
        - { name: scope, in: query, required: false, schema: { type: string, enum: [release, day], default: release } }
      responses:
        '200':
          description: The days' releases, back on schedule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Releases' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/businesses/{businessId}/releases:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [releases]
      operationId: listReleases
      summary: Each active schedule's release of every day in a range (admin)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: 'Inclusive; at most 31 days.', schema: { type: string, format: date } }
      responses:
        '200':
          description: Releases by schedule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Releases' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ OAuth and customer MCP (section 20)
  /.well-known/oauth-authorization-server:
    get:
      tags: [oauth]
      operationId: getAuthorizationServerMetadata
      summary: OAuth 2.0 authorization server metadata (RFC 8414)
      description: Served at the API root and, through the frontend rewrite, at `${APP_BASE_URL}/.well-known/oauth-authorization-server`.
      security: []
      responses:
        '200':
          description: Metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationServerMetadata' }

  /.well-known/oauth-protected-resource:
    get:
      tags: [oauth]
      operationId: getProtectedResourceMetadataAtRoot
      summary: Protected resource metadata at the root path (the same document as below)
      security: []
      responses:
        '200':
          description: Metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedResourceMetadata' }
  /.well-known/oauth-protected-resource/mcp:
    get:
      tags: [oauth]
      operationId: getProtectedResourceMetadata
      summary: Protected resource metadata of the customer MCP server (RFC 9728)
      description: 'The path after `/.well-known/oauth-protected-resource` is the path of `MCP_RESOURCE_URL` (default `/mcp`); the root path serves the same document.'
      security: []
      responses:
        '200':
          description: Metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedResourceMetadata' }

  /v1/oauth/register:
    post:
      tags: [oauth]
      operationId: registerOAuthClient
      summary: Dynamic Client Registration (RFC 7591)
      description: |
        Registers a public client (`token_endpoint_auth_method` is always `none`; PKCE is required). Redirect URIs must be https,
        http on a loopback address, or a private-use app scheme; at most 10. Errors use RFC 7591 (`invalid_redirect_uri`,
        `invalid_client_metadata`). Clients can instead use an https URL of a Client ID Metadata Document as `client_id`
        without registering. Rate limit: 300 per hour per IP (AI platforms register from shared addresses).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                redirect_uris: { type: array, items: { type: string } }
                client_name: { type: string }
                client_uri: { type: string }
                grant_types: { type: array, items: { type: string, enum: [authorization_code, refresh_token] } }
                response_types: { type: array, items: { type: string, enum: [code] } }
                token_endpoint_auth_method: { type: string }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthClientRegistration' }
        '400':
          description: RFC 7591 error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429':
          description: '`temporarily_unavailable`: rate limited.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }

  /v1/oauth/token:
    post:
      tags: [oauth]
      operationId: oauthToken
      summary: Token endpoint (authorization_code with PKCE, refresh_token with rotation)
      description: |
        `application/x-www-form-urlencoded`. Public clients identify with `client_id`. Codes are single use and live 5 minutes;
        presenting a used code or a rotated refresh token revokes the whole grant. Access tokens live 1 hour and are bound to
        `MCP_RESOURCE_URL` (RFC 8707 `resource` optional, must match). Refresh tokens live 30 days and rotate on every use; a
        refresh may narrow `scope`. Errors per RFC 6749 5.2. Responses are `Cache-Control: no-store`. Rate limit: 600 per minute per IP.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                client_id: { type: string }
                code: { type: string }
                redirect_uri: { type: string }
                code_verifier: { type: string, minLength: 43, maxLength: 128 }
                refresh_token: { type: string }
                scope: { type: string }
                resource: { type: string }
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthTokenResponse' }
        '400':
          description: '`invalid_request`, `invalid_grant`, `unsupported_grant_type`, `invalid_scope` or `invalid_target`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: '`invalid_client`: unknown client.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429':
          description: '`temporarily_unavailable`: rate limited.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }

  /v1/oauth/revoke:
    post:
      tags: [oauth]
      operationId: oauthRevoke
      summary: Token revocation (RFC 7009)
      description: 'Revoking a refresh token ends the whole grant; revoking an access token ends that token. Unknown tokens also answer 200.'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string }
                client_id: { type: string }
      responses:
        '200': { description: Revoked (or unknown). }

  /v1/oauth/authorize:
    get:
      tags: [oauth]
      operationId: checkAuthorization
      summary: Validate an authorization request for the consent page (signed-in user)
      description: |
        The authorization endpoint is the frontend page `${APP_BASE_URL}/oauth/authorize`; it signs the user in with the normal
        web login and calls this with the same query parameters. An unknown client or a redirect URI that isn't registered is
        400 `INVALID_REQUEST` (never redirected). Other problems return `{type:"redirect"}` with an RFC 6749 error, `state` and
        `iss` on the registered redirect URI. Loopback redirect URIs match on any port (RFC 8252 7.3).
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: scope, in: query, schema: { type: string }, description: 'Space-separated; default all of `bookings:read bookings:write marketplace:read`.' }
        - { name: state, in: query, schema: { type: string, maxLength: 1000 } }
        - { name: resource, in: query, schema: { type: string }, description: Must be `MCP_RESOURCE_URL` when given. }
      responses:
        '200':
          description: Show the consent screen, or send the browser back with an error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizeCheck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [oauth]
      operationId: decideAuthorization
      summary: Approve or deny (signed-in user)
      description: 'Approving records the consent (one active grant per user and app) and issues a code. The result is where to send the browser: the registered redirect URI with `code` (or `error=access_denied`), `state` and `iss`. Rate limit: 60 per 10 minutes per IP.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request, approve]
              properties:
                request: { $ref: '#/components/schemas/AuthorizeRequest' }
                approve: { type: boolean }
      responses:
        '200':
          description: Redirect target.
          content:
            application/json:
              schema:
                type: object
                required: [redirectTo]
                properties:
                  redirectTo: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/me/notifications:
    get:
      tags: [me]
      operationId: listNotifications
      summary: My notifications (the bell)
      description: The signed-in person's 30 most recent notifications, newest first, and how many are unread (section 22).
      responses:
        '200':
          description: Notifications.
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  unreadCount: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/me/notifications/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [me]
      operationId: readNotification
      summary: Mark one read
      description: 'Idempotent. Someone else''s: 404.'
      responses:
        '204': { description: Read. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/me/notifications/read-all:
    post:
      tags: [me]
      operationId: readAllNotifications
      summary: Mark all read
      responses:
        '204': { description: All read. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/me/notification-settings:
    get:
      tags: [me]
      operationId: getNotificationSettings
      summary: Which notifications are also emailed
      description: Every kind, with whether it is emailed for this person (in the app always). `forMembers` / `forCustomers` say who can get it.
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      operationId: updateNotificationSettings
      summary: Choose which notifications are emailed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email:
                  type: object
                  description: 'Kind → emailed, e.g. `{"new_booking": true}`. Kinds left out are unchanged.'
                  additionalProperties: { type: boolean }
      responses:
        '200':
          description: The settings now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/me/push-devices:
    post:
      tags: [me]
      operationId: registerPushDevice
      summary: Get notifications on this phone (mobile app)
      description: |
        The mobile app registers the phone it runs on, on every launch and sign-in (section 22). Idempotent per token:
        registering again refreshes `lastSeenAt`; a token registered by someone else (the last person to sign in on that
        phone) moves to the caller, and one that was revoked gets notifications again. A person keeps at most 20 phones;
        beyond that the one seen longest ago stops getting them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushDeviceInput' }
      responses:
        '200':
          description: The registered phone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushDevice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [me]
      operationId: unregisterPushDevice
      summary: Stop notifications on this phone (sign-out)
      description: Revokes the token if it is the caller's. 204 whether or not it was (idempotent; never reveals whose a token is).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushDeviceDelete' }
      responses:
        '204': { description: The phone no longer gets the caller's notifications. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/me/agent-requests:
    get:
      tags: [me]
      operationId: listCustomerAgentRequests
      summary: My AI apps' requests
      description: What the signed-in customer's own AI apps (customer MCP) asked to do in the last 7 days, newest first (at most 50; section 20.8).
      responses:
        '200':
          description: Requests.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CustomerAgentRequest' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/me/agent-requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [me]
      operationId: getCustomerAgentRequest
      summary: One of my AI apps' requests
      description: 'The approval page, prepared again so it shows what would happen now. Someone else''s: 404.'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAgentRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/me/agent-requests/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [me]
      operationId: approveCustomerAgentRequest
      summary: Approve and carry out an AI app's request
      description: |
        Books, moves or cancels as the customer through the website's own rules, audited as actor `api` via the app. Needs a
        signed-in session (an app's token is only valid at the MCP). Prepared again first: if it changed since it was
        prepared, the new preview is stored and 409 `CONFLICT` asks the customer to check it again. Idempotent. Expired,
        declined or failed, or the app was disconnected since: 409. A booking that can't be made any more (the time was
        taken) ends `failed` with `error`. A paid booking's result links to its payment page.
      responses:
        '200':
          description: The request, decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAgentRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/me/agent-requests/{id}/decline:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [me]
      operationId: declineCustomerAgentRequest
      summary: Decline an AI app's request
      description: 'Nothing happens; idempotent. Already carried out or failed: 409.'
      responses:
        '200':
          description: The request, decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAgentRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/me/agent-settings:
    get:
      tags: [me]
      operationId: getCustomerAgentSettings
      summary: What my AI apps may do without my approval here
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAgentSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      operationId: updateCustomerAgentSettings
      summary: Choose what my AI apps may do once they confirm it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autoApprove]
              additionalProperties: false
              properties:
                autoApprove: { type: array, items: { type: string, enum: [bookings, cancellations] } }
      responses:
        '200':
          description: The settings now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAgentSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/me/connected-apps:
    get:
      tags: [oauth]
      operationId: listConnectedApps
      summary: Apps the user has connected (active grants)
      responses:
        '200':
          description: Connected apps, newest consent first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectedApp' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/connected-apps/{grantId}:
    delete:
      tags: [oauth]
      operationId: revokeConnectedApp
      summary: Disconnect an app (revokes all its tokens)
      parameters:
        - { name: grantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Disconnected. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/mcp/customer:
    post:
      tags: [mcp]
      operationId: customerMcp
      summary: Signed-in customer MCP server (Streamable HTTP, stateless, OAuth)
      description: |
        Public URL: `MCP_RESOURCE_URL` (default `${APP_BASE_URL}/mcp`, rewritten here by the frontend). Needs
        `Authorization: Bearer <access token>` from our authorization server, issued for this resource. Without a valid token:
        401 with `WWW-Authenticate: Bearer resource_metadata="…/.well-known/oauth-protected-resource/mcp", scope="…"` (and
        `error="invalid_token"` for a bad token). A `tools/call` of a tool whose scope the token lacks: 403 with
        `error="insufficient_scope"` and the scopes needed. Tools: `search_marketplace`, `get_business`, `check_availability`
        (`marketplace:read`); `list_my_bookings`, `get_next_appointment`, `find_times_to_move`, `get_payment_link`
        (`bookings:read`, with `get_proposal`); `book`, `reschedule_booking`, `cancel_booking`, `confirm_action`, `cancel_action`
        (`bookings:write`, which implies read). `book`, `reschedule_booking` and `cancel_booking` only prepare a request
        (section 20.8): `awaiting_approval` (24 hours) goes ahead only when the user approves it signed in at its `approvalUrl`
        (`/my/approvals/{id}`; see `me/agent-requests`), and the user is notified; a kind the user auto-approves
        (`me/agent-settings`) is `awaiting_confirmation` (30 minutes) and `confirm_action` carries it out. Tools act as the user
        through the same services as the website
        (source `api`, audited as actor `api` with `via: oauth:<client_id>`). Arguments are decoded strictly; failures are
        results with `isError: true` and text `"<ERROR_CODE>: <message>"`. Rate limits are per grant (120 requests per minute;
        searches and availability as the public API) and bookings per user (the public booking limit and 10 per 10 minutes), never per
        IP, because AI platforms share egress addresses; a 3000/min per-IP ceiling only stops floods before authentication.
        GET and DELETE return 405 (after authentication).
      security:
        - oauth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A JSON-RPC request or notification. }
      responses:
        '200':
          description: JSON-RPC response.
          content:
            application/json:
              schema: { type: object }
        '202':
          description: Accepted (notifications only).
        '401': { description: 'No or invalid access token; see `WWW-Authenticate`.' }
        '403': { description: 'The token lacks the tool''s scope; see `WWW-Authenticate`.' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [mcp]
      operationId: customerMcpGet
      summary: Not supported (stateless; 401 before authentication, 405 after)
      security:
        - oauth: []
      responses:
        '401': { description: 'No or invalid access token; see `WWW-Authenticate`.' }
        '405': { description: Method not allowed. }
    delete:
      tags: [mcp]
      operationId: customerMcpDelete
      summary: Not supported (no sessions; 401 before authentication, 405 after)
      security:
        - oauth: []
      responses:
        '401': { description: 'No or invalid access token; see `WWW-Authenticate`.' }
        '405': { description: Method not allowed. }
  /v1/mcp/business:
    post:
      tags: [mcp]
      operationId: businessMcp
      summary: Business MCP server for members' own AI apps (Streamable HTTP, stateless, OAuth)
      description: |
        Served unless `BUSINESS_MCP_ENABLED` is `false` (a kill switch; on by default). Public URL: `MCP_BUSINESS_RESOURCE_URL`
        (default `${MCP_RESOURCE_URL}/business`, i.e. `${APP_BASE_URL}/mcp/business`, rewritten here by the frontend). Needs
        `Authorization: Bearer <access token>` issued for this resource; a customer-MCP token is refused (audience), and the
        other way round. Without a valid token: 401 with `WWW-Authenticate: Bearer
        resource_metadata="…/.well-known/oauth-protected-resource/mcp/business", scope="business:read business:write"`.
        A `tools/call` of a tool whose scope the token lacks: 403 `insufficient_scope`.

        One connection reaches every business the user is an active member of; each call names one (`business`: slug or
        id; optional when there is only one) and runs as the member there, with their current role and staff scope, through
        the same commands as the dashboard. A business whose owner doesn't let the member use AI apps (`aiAgentsAccess`: `off`,
        or `admins` for a staff member) refuses every call with FORBIDDEN. Tools: `list_my_businesses`, Bo's read tools
        (`business:read`; e.g. `get_schedule`, `find_bookings`, `get_booking`, `find_customers`, `get_customer`,
        `check_availability`, `list_time_off`; `get_stats` and `list_deals` for admins), `get_proposal`, and Bo's write tools
        (`business:write`). Write tools never change anything: they validate and return a proposal, stored as a pending
        assistant action tied to the grant. By default its status is `awaiting_approval` (24 hours): only the member can
        carry it out, by approving it on bookanything at its `approvalUrl` (`/dashboard/{slug}/approvals/{id}`; see
        `agent-requests`); `confirm_action` leaves it waiting. A single change of a kind the owner auto-approves
        (`aiAgentsAutoApprove`) is `awaiting_confirmation` (30 minutes) and `confirm_action` carries it out. Either way it is
        audited as actor `ai` with `via: oauth:<client_id>` and `approvedBy: member | app`; `cancel_action` drops it. Only the
        grant that proposed (or the member) can decide a proposal. Tools above the member's highest role are not listed.
        Rate limits: 120 requests per minute per grant; 60 proposals per 10 minutes per grant; 60 confirmations per 10
        minutes per user; a 3000/min per-IP ceiling before authentication. GET and DELETE return 405 (after authentication).
      security:
        - oauth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A JSON-RPC request or notification. }
      responses:
        '200':
          description: JSON-RPC response.
          content:
            application/json:
              schema: { type: object }
        '202':
          description: Accepted (notifications only).
        '401': { description: 'No or invalid access token; see `WWW-Authenticate`.' }
        '403': { description: 'The token lacks the tool''s scope; see `WWW-Authenticate`.' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [mcp]
      operationId: businessMcpGet
      summary: Not supported (stateless; 401 before authentication, 405 after)
      security:
        - oauth: []
      responses:
        '401': { description: 'No or invalid access token; see `WWW-Authenticate`.' }
        '405': { description: Method not allowed. }
    delete:
      tags: [mcp]
      operationId: businessMcpDelete
      summary: Not supported (no sessions; 401 before authentication, 405 after)
      security:
        - oauth: []
      responses:
        '401': { description: 'No or invalid access token; see `WWW-Authenticate`.' }
        '405': { description: Method not allowed. }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'Clerk session JWT, or `dev.<base64url(JSON)>` when `AUTH_MODE=dev`.'
    oauth:
      type: oauth2
      description: 'MCP access tokens from our authorization server (authorization code + PKCE S256; section 20), each for one resource: the customer MCP (bookings:*, marketplace:read) or the business MCP (business:*).'
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:3000/oauth/authorize
          tokenUrl: http://localhost:3000/api/v1/oauth/token
          refreshUrl: http://localhost:3000/api/v1/oauth/token
          scopes:
            'bookings:read': See your bookings
            'bookings:write': Book, reschedule and cancel for you (implies bookings:read)
            'marketplace:read': Search businesses and availability
            'business:read': See the businesses you're a member of (business MCP)
            'business:write': Propose changes for you to confirm (business MCP; implies business:read)

  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SiteVersionNumber:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Slug:
      name: slug
      in: path
      required: true
      description: Business slug (case-insensitive).
      schema: { type: string, minLength: 1, maxLength: 60 }
    TemplateKey:
      name: key
      in: path
      required: true
      description: Template key, e.g. `physio`, `salon`, `generic`.
      schema: { type: string }
    ManageToken:
      name: token
      in: path
      required: true
      description: The secret manage token from `BookingResult.manageToken` or the confirmation email. Invalid tokens return 404.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{20,100}$' }
    InvitationToken:
      name: token
      in: path
      required: true
      description: The invitation token (from the email or `Me.pendingInvitations`). Invalid tokens return 404.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{20,100}$' }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OverrideId:
      name: overrideId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional client-generated key made of 8-100 characters from `[A-Za-z0-9_\-:.]`.
        Repeating a request with the same key returns the original booking with 200.
      schema: { type: string, pattern: '^[A-Za-z0-9_\-:.]{8,100}$' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `nextCursor`.
      schema: { type: string }
    ServiceIdQueryRequired:
      name: serviceId
      in: query
      required: true
      schema: { type: string, format: uuid }
    FromRequired:
      name: from
      in: query
      required: true
      description: First day (inclusive), in the business timezone.
      schema: { type: string, format: date }
    ToRequired:
      name: to
      in: query
      required: true
      description: Last day (inclusive). Must be on or after `from`, and the range can be at most 31 days.
      schema: { type: string, format: date }
    OptionIdQuery:
      name: optionId
      in: query
      required: false
      description: Selected service option. Its duration and price replace the service's.
      schema: { type: string, format: uuid }
    AddonIdsQuery:
      name: addonIds
      in: query
      required: false
      description: Comma-separated add-on ids.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string, format: uuid }
    GroupIdQuery:
      name: groupId
      in: query
      required: false
      description: The customer group booking. Affects restricted windows and services.
      schema: { type: string, format: uuid }
    AfterQuery:
      name: after
      in: query
      required: false
      description: |
        Only slots starting strictly after this instant: pass the start of the last slot shown to step to later ones
        (with `policies.nextAvailableOnly` the response then holds the next free time). ISO-8601 with offset, as slot starts
        are returned (a local date-time is read in the business's timezone; encode `+` as `%2B`).
      schema: { type: string, format: date-time }

  responses:
    BadRequest:
      description: '`INVALID_REQUEST`: malformed or invalid input, with per-field messages in `error.fields`. Can also be `INVALID_TIMEZONE`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: '`UNAUTHENTICATED`: the bearer token is missing, invalid or expired.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '`FORBIDDEN`: the role is too low, or a staff member tried to act outside their own resources.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`NOT_FOUND`: the entity was not found, or the caller cannot see it.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: |
        One of `CONFLICT`, `SLOT_UNAVAILABLE`, `PRICE_CHANGED`, `POLICY_VIOLATION`, `PLAN_LIMIT_REACHED`, `PAYMENTS_NOT_CONFIGURED`, `SLUG_TAKEN`
        or `AI_LIMIT_REACHED` (the monthly AI site allowance of the plan is used; the message names the plan and the allowance).
        Unique and foreign-key violations also map to `CONFLICT`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: '`RATE_LIMITED`: a rate limit (per IP, or per user where noted) was exceeded.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: '`DATABASE_UNAVAILABLE`: the database cannot be reached.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: '`UPLOAD_FAILED` (the image store failed) or `STOCK_PHOTOS_UNAVAILABLE` (Unsplash failed). Safe to retry.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------------------------------------------------------------- errors / misc
    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - SLOT_UNAVAILABLE
        - PRICE_CHANGED
        - RATE_LIMITED
        - PLAN_LIMIT_REACHED
        - PAYMENTS_NOT_CONFIGURED
        - POLICY_VIOLATION
        - SLUG_TAKEN
        - INVALID_TIMEZONE
        - DATABASE_UNAVAILABLE
        - INTERNAL_SERVER_ERROR
        - PAYMENT_PROVIDER_ERROR
        - INVALID_SIGNATURE
        - WEBHOOKS_NOT_CONFIGURED
        - AI_LIMIT_REACHED
        - AI_NOT_CONFIGURED
        - UPLOADS_NOT_CONFIGURED
        - UPLOAD_FAILED
        - STOCK_PHOTOS_UNAVAILABLE
        - PAYLOAD_TOO_LARGE
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: Safe to show to end users.
            fields:
              type: object
              description: Per-field problems, e.g. `{"customer.email":"Must be a valid email address"}`. Empty when not applicable.
              additionalProperties: { type: string }
    Health:
      type: object
      required: [status, database, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unavailable] }
        version:
          type: string
          description: >-
            The build running, as the release train named it when it built the image (the nightly, e.g.
            `0.4.0-nightly.20261104.17`, also once staged and released); `dev` outside the release train.
    SlugAvailability:
      type: object
      required: [available, suggestion]
      properties:
        available: { type: boolean }
        suggestion:
          type: [string, 'null']
          description: A free alternative when not available. Otherwise `null`.
    CheckoutUrlResponse:
      type: object
      required: [checkoutUrl]
      properties:
        checkoutUrl: { type: string }
    RedirectResponse:
      type: object
      required: [redirectUrl]
      properties:
        redirectUrl: { type: string }
    UrlResponse:
      type: object
      required: [url]
      properties:
        url: { type: string }

    WebhookAck:
      type: object
      required: [received, duplicate]
      properties:
        received: { type: boolean }
        duplicate: { type: boolean, description: True when this event id was already received. }

    # ---------------------------------------------------------------- enums
    BookingStatus:
      type: string
      enum: [held, pending_approval, confirmed, completed, cancelled, no_show, expired]
    PaymentStatus:
      type: string
      enum: [not_required, pending, paid, partially_refunded, refunded, failed, pay_at_venue]
    PaymentMode:
      type: string
      enum: [full, deposit, at_venue, free]
    ResourceKind:
      type: string
      enum: [person, space, equipment]
    LocationType:
      type: string
      enum: [business, customer, online]
    QuestionKind:
      type: string
      enum: [text, textarea, select, checkbox, number, phone, email]
    Role:
      type: string
      enum: [owner, admin, staff]
    BusinessStatus:
      type: string
      enum: [draft, active, suspended]
    Plan:
      type: string
      enum: [free, pro, business]
    BookingSource:
      type: string
      enum: [public, dashboard, api, ai]
    ActorType:
      type: string
      enum: [owner, member, customer, guest, system, ai, api]

    # ---------------------------------------------------------------- business value objects
    Vocabulary:
      type: object
      required: [resource, resources, customer, customers, booking, bookings]
      properties:
        resource: { type: string }
        resources: { type: string }
        customer: { type: string }
        customers: { type: string }
        booking: { type: string }
        bookings: { type: string }
    VocabularyInput:
      type: object
      description: When an object is sent, every omitted property takes its default value. Omitted properties are not merged with the stored ones.
      properties:
        resource: { type: string, maxLength: 40, default: Staff member }
        resources: { type: string, maxLength: 40, default: Staff }
        customer: { type: string, maxLength: 40, default: Customer }
        customers: { type: string, maxLength: 40, default: Customers }
        booking: { type: string, maxLength: 40, default: Booking }
        bookings: { type: string, maxLength: 40, default: Bookings }
    Branding:
      type: object
      required: [primaryColor, logoUrl, coverImageUrl]
      properties:
        primaryColor: { type: string, pattern: '^#[0-9a-f]{6}$', description: 'Lowercase `#rrggbb`.' }
        logoUrl: { type: [string, 'null'] }
        coverImageUrl: { type: [string, 'null'] }
    BrandingInput:
      type: object
      description: When an object is sent, every omitted property takes its default value.
      properties:
        primaryColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$', default: '#4f46e5' }
        logoUrl: { type: [string, 'null'], maxLength: 500, description: 'An http(s) URL.' }
        coverImageUrl: { type: [string, 'null'], maxLength: 500, description: 'An http(s) URL.' }
    Policies:
      type: object
      required:
        - minNoticeMinutes
        - maxAdvanceDays
        - cancellationNoticeHours
        - lateCancellationRefundPercent
        - allowCustomerCancel
        - allowCustomerReschedule
        - holdMinutes
        - requireCustomerPhone
        - nextAvailableOnly
      properties:
        minNoticeMinutes: { type: integer }
        maxAdvanceDays: { type: integer }
        cancellationNoticeHours: { type: integer }
        lateCancellationRefundPercent: { type: integer, minimum: 0, maximum: 100 }
        allowCustomerCancel: { type: boolean }
        allowCustomerReschedule: { type: boolean }
        holdMinutes: { type: integer, description: 'How long a `held` booking waits for payment.' }
        requireCustomerPhone: { type: boolean }
        nextAvailableOnly:
          type: boolean
          description: 'Customers are shown only the next available time (and may step to later ones), not every free time. Staff availability is unchanged.'
    PoliciesInput:
      type: object
      description: When an object is sent, every omitted property takes its default value.
      properties:
        minNoticeMinutes: { type: integer, minimum: 0, maximum: 129600, default: 60 }
        maxAdvanceDays: { type: integer, minimum: 1, maximum: 730, default: 60 }
        cancellationNoticeHours: { type: integer, minimum: 0, maximum: 1440, default: 24 }
        lateCancellationRefundPercent: { type: integer, minimum: 0, maximum: 100, default: 0 }
        allowCustomerCancel: { type: boolean, default: true }
        allowCustomerReschedule: { type: boolean, default: true }
        holdMinutes: { type: integer, minimum: 5, maximum: 1440, default: 30 }
        requireCustomerPhone: { type: boolean, default: false }
        nextAvailableOnly: { type: boolean, default: false }
    Address:
      type: object
      required: [line1, line2, city, postcode]
      properties:
        line1: { type: [string, 'null'] }
        line2: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        postcode: { type: [string, 'null'] }
    AddressInput:
      type: object
      description: When an object is sent, every omitted property becomes `null`.
      properties:
        line1: { type: [string, 'null'], maxLength: 200 }
        line2: { type: [string, 'null'], maxLength: 200 }
        city: { type: [string, 'null'], maxLength: 100 }
        postcode: { type: [string, 'null'], maxLength: 20 }

    # ---------------------------------------------------------------- business
    PublicCustomerGroup:
      type: object
      description: An active customer group, as shown on the public page.
      required: [id, name, description]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
    PublicBusiness:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - industry
        - timezone
        - currency
        - locale
        - contactEmail
        - contactPhone
        - websiteUrl
        - address
        - branding
        - vocabulary
        - policies
        - customerGroups
        - paymentsEnabled
        - showBadge
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        industry: { type: string }
        timezone: { type: string, description: 'IANA zone id, e.g. `Europe/Dublin`.' }
        currency: { type: string, description: 'ISO 4217 code.' }
        locale: { type: string, description: 'e.g. `en-IE`.' }
        contactEmail: { type: [string, 'null'] }
        contactPhone: { type: [string, 'null'] }
        websiteUrl: { type: [string, 'null'] }
        address: { $ref: '#/components/schemas/Address' }
        branding: { $ref: '#/components/schemas/Branding' }
        vocabulary: { $ref: '#/components/schemas/Vocabulary' }
        policies: { $ref: '#/components/schemas/Policies' }
        customerGroups:
          type: array
          items: { $ref: '#/components/schemas/PublicCustomerGroup' }
        paymentsEnabled: { type: boolean, description: 'Whether the business can take online payments.' }
        showBadge: { type: boolean, description: 'True on the Free plan.' }
        site:
          description: |
            Only on `GET /v1/public/businesses/{slug}`: the published site plan, or the default plan with
            `isDefault: true`. Other embeddings of PublicBusiness (dev payments, MCP `find_business`) send `null`;
            the dashboard `Business` does not have this property.
          oneOf:
            - $ref: '#/components/schemas/PublicSite'
            - type: 'null'
    Business:
      allOf:
        - $ref: '#/components/schemas/PublicBusiness'
        - type: object
          required: [status, country, plan, myRole, createdAt]
          properties:
            status: { $ref: '#/components/schemas/BusinessStatus' }
            country: { type: string, description: 'ISO 3166 alpha-2.' }
            plan: { $ref: '#/components/schemas/Plan' }
            myRole: { $ref: '#/components/schemas/Role' }
            createdAt: { type: string, format: date-time }
            aiAgentsAccess:
              type: string
              enum: [off, admins, team]
              description: "Who may use the business from their own AI apps (business MCP): nobody, owners and admins (default), or the whole team."
            aiAgentsAutoApprove:
              type: array
              items: { $ref: '#/components/schemas/AgentChangeKind' }
              description: "Kinds of single change members' AI apps make once the app confirms them, without approval on bookanything (none by default)."
            aiAgentsAvailable: { type: boolean, description: "This deployment serves the business MCP (`BUSINESS_MCP_ENABLED`)." }
    UpdateBusiness:
      type: object
      description: |
        Partial update. Omitted keys are unchanged. Only the nullable fields accept `null`, which clears them.
        `address`, `branding`, `vocabulary` and `policies` are merged into the stored object: properties omitted
        inside a sent object keep their stored values.
      properties:
        name: { type: string, maxLength: 100 }
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,48}[a-z0-9]$'
          description: Lowercased server-side. Reserved words and `--` are rejected. If taken, the response is 409 `SLUG_TAKEN`.
        description: { type: [string, 'null'], maxLength: 2000 }
        timezone: { type: string, description: 'IANA region id (e.g. `Europe/Dublin`) or `UTC`.' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        locale: { type: string, pattern: '^[a-z]{2,3}(-[A-Z]{2})?$' }
        contactEmail: { type: [string, 'null'] }
        contactPhone: { type: [string, 'null'] }
        websiteUrl: { type: [string, 'null'], maxLength: 500 }
        address: { $ref: '#/components/schemas/AddressInput' }
        branding: { $ref: '#/components/schemas/BrandingInput' }
        vocabulary: { $ref: '#/components/schemas/VocabularyInput' }
        policies: { $ref: '#/components/schemas/PoliciesInput' }
        status: { type: string, enum: [draft, active] }
        aiAgentsAccess: { type: string, enum: [off, admins, team], description: "Who may use the business from their own AI apps (owners only)." }
        aiAgentsAutoApprove:
          type: array
          items: { $ref: '#/components/schemas/AgentChangeKind' }
          description: "Kinds of single change that go ahead without approval on bookanything (owners only)."
    ChecklistItem:
      type: object
      required: [key, done]
      properties:
        key: { type: string, enum: [services, resources, availability, payments, branding, publish] }
        done: { type: boolean }
    Overview:
      type: object
      required: [today, upcomingCount7d, revenueCents30d, bookings30d, checklist]
      properties:
        today:
          type: array
          description: Today's bookings (excluding expired and cancelled), in the business timezone.
          items: { $ref: '#/components/schemas/Booking' }
        upcomingCount7d: { type: integer, description: 'Held, pending_approval or confirmed bookings starting in the next 7 days.' }
        revenueCents30d: { type: integer, description: 'Net payments over the last 30 days. Always 0 for staff.' }
        bookings30d: { type: integer, description: 'Non-expired bookings created in the last 30 days.' }
        checklist:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }

    # ---------------------------------------------------------------- resources & availability
    Resource:
      type: object
      required: [id, kind, name, description, color, capacity, memberId, isActive, sortOrder]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ResourceKind' }
        name: { type: string }
        description: { type: [string, 'null'] }
        color: { type: string, description: 'Lowercase `#rrggbb`.' }
        capacity: { type: integer }
        memberId: { type: [string, 'null'], format: uuid, description: 'The linked team member.' }
        isActive: { type: boolean }
        sortOrder: { type: integer }
    ResourceInput:
      type: object
      required: [kind, name]
      properties:
        kind: { $ref: '#/components/schemas/ResourceKind' }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 1000 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', default: '#64748b' }
        capacity: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        memberId: { type: [string, 'null'], format: uuid, description: 'A non-removed team member of this business.' }
        isActive: { type: boolean, default: true }
        sortOrder: { type: integer, minimum: -10000, maximum: 10000, default: 0 }
    ResourceUpdate:
      type: object
      description: Partial update. `description` and `memberId` can be cleared with `null`.
      properties:
        kind: { $ref: '#/components/schemas/ResourceKind' }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 1000 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        capacity: { type: integer, minimum: 1, maximum: 1000 }
        memberId: { type: [string, 'null'], format: uuid }
        isActive: { type: boolean }
        sortOrder: { type: integer, minimum: -10000, maximum: 10000 }
    AvailabilityRule:
      type: object
      required: [id, resourceId, dayOfWeek, startTime, endTime, validFrom, validUntil, audienceGroupIds]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        dayOfWeek: { type: integer, minimum: 1, maximum: 7, description: 'ISO day of week: 1 = Monday, 7 = Sunday.' }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        validFrom: { type: [string, 'null'], format: date }
        validUntil: { type: [string, 'null'], format: date }
        audienceGroupIds:
          type: array
          description: If non-empty, the window is open only to these customer groups.
          items: { type: string, format: uuid }
    AvailabilityRuleInput:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):([0-5]\d)(:00)?$', description: '`HH:mm` (`:00` seconds tolerated).' }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):([0-5]\d)(:00)?$', description: 'Must be after `startTime`.' }
        validFrom: { type: [string, 'null'], format: date }
        validUntil: { type: [string, 'null'], format: date, description: 'On or after `validFrom`.' }
        audienceGroupIds:
          type: array
          default: []
          items: { type: string, format: uuid }
    ReplaceRulesInput:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AvailabilityRuleInput' }
    AvailabilityRulesResponse:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityRule' }
    AvailabilityOverride:
      type: object
      required: [id, resourceId, date, isAvailable, startTime, endTime, reason]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: [string, 'null'], format: uuid, description: '`null` for business-wide closures.' }
        date: { type: string, format: date }
        isAvailable: { type: boolean }
        startTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        endTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        reason: { type: [string, 'null'] }
    AvailabilityOverrideInput:
      type: object
      required: [date, isAvailable]
      description: 'Give both `startTime` and `endTime`, or neither. Extra availability (`isAvailable: true`) needs both.'
      properties:
        date: { type: string, format: date }
        isAvailable: { type: boolean }
        startTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):([0-5]\d)(:00)?$' }
        endTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):([0-5]\d)(:00)?$' }
        reason: { type: [string, 'null'], maxLength: 200 }
    ResourceAvailability:
      type: object
      required: [rules, overrides]
      properties:
        rules:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityRule' }
        overrides:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityOverride' }

    # ---------------------------------------------------------------- customer groups
    CustomerGroup:
      type: object
      required: [id, name, description, restricted, sortOrder, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        restricted: { type: boolean, description: 'Restricted groups can only book availability windows that list them.' }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    CustomerGroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 500 }
        restricted: { type: boolean, default: false }
        sortOrder: { type: integer, minimum: -10000, maximum: 10000, default: 0 }
        isActive: { type: boolean, default: true }
    CustomerGroupUpdate:
      type: object
      description: Partial update. `description` can be cleared with `null`.
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 500 }
        restricted: { type: boolean }
        sortOrder: { type: integer, minimum: -10000, maximum: 10000 }
        isActive: { type: boolean }

    # ---------------------------------------------------------------- services
    ServiceOption:
      type: object
      required: [id, name, description, durationMinutes, priceCents, sortOrder]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        durationMinutes: { type: integer }
        priceCents: { type: integer }
        sortOrder: { type: integer }
    ServiceAddon:
      type: object
      required: [id, name, description, extraMinutes, priceCents, sortOrder]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        extraMinutes: { type: integer }
        priceCents: { type: integer }
        sortOrder: { type: integer }
    ServiceRequirement:
      type: object
      required: [id, label, quantity, customerSelectable, resourceIds, sortOrder]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        quantity: { type: integer, description: 'How many resources from the pool each booking needs.' }
        customerSelectable: { type: boolean }
        resourceIds:
          type: array
          items: { type: string, format: uuid }
        sortOrder: { type: integer }
    Service:
      type: object
      required:
        - id
        - name
        - description
        - category
        - color
        - durationMinutes
        - bufferBeforeMinutes
        - bufferAfterMinutes
        - slotIntervalMinutes
        - minNoticeMinutes
        - maxAdvanceDays
        - capacity
        - priceCents
        - paymentMode
        - depositCents
        - allowPayAtVenue
        - requiresApproval
        - locationType
        - allowedGroupIds
        - isPublic
        - isActive
        - sortOrder
        - options
        - addons
        - requirements
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        color: { type: string }
        durationMinutes: { type: integer }
        bufferBeforeMinutes: { type: integer }
        bufferAfterMinutes: { type: integer }
        slotIntervalMinutes: { type: [integer, 'null'] }
        minNoticeMinutes: { type: [integer, 'null'], description: '`null` means the business policy applies.' }
        maxAdvanceDays: { type: [integer, 'null'], description: '`null` means the business policy applies.' }
        capacity: { type: integer, description: 'Seats per slot (>1 for classes).' }
        priceCents: { type: integer }
        paymentMode: { $ref: '#/components/schemas/PaymentMode' }
        depositCents: { type: [integer, 'null'] }
        allowPayAtVenue:
          type: boolean
          description: A `full` or `deposit` service the customer may choose to pay at the venue instead. Always false for other modes.
        requiresApproval: { type: boolean }
        locationType: { $ref: '#/components/schemas/LocationType' }
        allowedGroupIds:
          type: array
          description: If non-empty, only these customer groups may book.
          items: { type: string, format: uuid }
        isPublic: { type: boolean }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        options:
          type: array
          items: { $ref: '#/components/schemas/ServiceOption' }
        addons:
          type: array
          items: { $ref: '#/components/schemas/ServiceAddon' }
        requirements:
          type: array
          items: { $ref: '#/components/schemas/ServiceRequirement' }
    ServiceOptionInput:
      type: object
      required: [name, durationMinutes]
      properties:
        id:
          type: [string, 'null']
          format: uuid
          description: Optional. On PUT, an item matching an existing id (or else name) is updated in place, so its id stays stable.
        name: { type: string, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 500 }
        durationMinutes: { type: integer, minimum: 5, maximum: 1440 }
        priceCents: { type: integer, minimum: 0, maximum: 10000000, default: 0 }
        sortOrder: { type: integer, default: 0 }
    ServiceAddonInput:
      type: object
      required: [name]
      properties:
        id:
          type: [string, 'null']
          format: uuid
          description: Optional. On PUT, an item matching an existing id (or else name) is updated in place, so its id stays stable.
        name: { type: string, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 500 }
        extraMinutes: { type: integer, minimum: 0, maximum: 480, default: 0 }
        priceCents: { type: integer, minimum: 0, maximum: 10000000, default: 0 }
        sortOrder: { type: integer, default: 0 }
    ServiceRequirementInput:
      type: object
      required: [label]
      properties:
        id:
          type: [string, 'null']
          format: uuid
          description: Optional. On PUT, an item matching an existing id (or else label) is updated in place, so its id stays stable.
        label: { type: string, maxLength: 100 }
        quantity: { type: integer, minimum: 1, maximum: 20, default: 1 }
        customerSelectable: { type: boolean, default: false, description: 'At most one requirement per service can be customer-selectable.' }
        resourceIds:
          type: array
          default: []
          description: At least one resource, and at least `quantity` of them.
          items: { type: string, format: uuid }
        sortOrder: { type: integer, default: 0 }
    ServiceInput:
      type: object
      required: [name, durationMinutes]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        category: { type: [string, 'null'], maxLength: 60 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', default: '#4f46e5' }
        durationMinutes: { type: integer, minimum: 5, maximum: 1440 }
        bufferBeforeMinutes: { type: integer, minimum: 0, maximum: 480, default: 0 }
        bufferAfterMinutes: { type: integer, minimum: 0, maximum: 480, default: 0 }
        slotIntervalMinutes: { type: [integer, 'null'], minimum: 5, maximum: 1440 }
        minNoticeMinutes: { type: [integer, 'null'], minimum: 0, maximum: 129600 }
        maxAdvanceDays: { type: [integer, 'null'], minimum: 1, maximum: 730 }
        capacity: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        priceCents: { type: integer, minimum: 0, maximum: 10000000, default: 0 }
        paymentMode: { allOf: [{ $ref: '#/components/schemas/PaymentMode' }], default: full }
        depositCents:
          type: [integer, 'null']
          description: Required (>0 and at most `priceCents`) when `paymentMode` is `deposit`.
        allowPayAtVenue:
          type: boolean
          default: false
          description: Let the customer choose to pay at the venue instead of online. Only kept for `full` and `deposit` services.
        requiresApproval: { type: boolean, default: false }
        locationType: { allOf: [{ $ref: '#/components/schemas/LocationType' }], default: business }
        allowedGroupIds:
          type: array
          default: []
          items: { type: string, format: uuid }
        isPublic: { type: boolean, default: true }
        isActive: { type: boolean, default: true }
        sortOrder: { type: integer, minimum: -10000, maximum: 10000, default: 0 }
        options:
          type: array
          maxItems: 30
          default: []
          items: { $ref: '#/components/schemas/ServiceOptionInput' }
        addons:
          type: array
          maxItems: 30
          default: []
          items: { $ref: '#/components/schemas/ServiceAddonInput' }
        requirements:
          type: array
          maxItems: 10
          default: []
          items: { $ref: '#/components/schemas/ServiceRequirementInput' }

    # ---------------------------------------------------------------- questions
    FormQuestion:
      type: object
      required: [id, serviceId, label, helpText, kind, options, required, sensitive, sortOrder, isActive]
      properties:
        id: { type: string, format: uuid }
        serviceId: { type: [string, 'null'], format: uuid, description: '`null` means the question applies to every service.' }
        label: { type: string }
        helpText: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/QuestionKind' }
        options:
          type: array
          description: Choices for `select`.
          items: { type: string }
        required: { type: boolean }
        sensitive: { type: boolean }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    FormQuestionInput:
      type: object
      required: [label]
      properties:
        serviceId: { type: [string, 'null'], format: uuid }
        label: { type: string, maxLength: 200 }
        helpText: { type: [string, 'null'], maxLength: 500 }
        kind: { allOf: [{ $ref: '#/components/schemas/QuestionKind' }], default: text }
        options:
          type: array
          maxItems: 50
          default: []
          description: Each option is 1-100 characters. `select` questions need at least one.
          items: { type: string, minLength: 1, maxLength: 100 }
        required: { type: boolean, default: false }
        sensitive: { type: boolean, default: false }
        sortOrder: { type: integer, minimum: -10000, maximum: 10000, default: 0 }
        isActive: { type: boolean, default: true }
    FormQuestionUpdate:
      type: object
      description: Partial update. `serviceId` and `helpText` can be cleared with `null`.
      properties:
        serviceId: { type: [string, 'null'], format: uuid }
        label: { type: string, maxLength: 200 }
        helpText: { type: [string, 'null'], maxLength: 500 }
        kind: { $ref: '#/components/schemas/QuestionKind' }
        options:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 100 }
        required: { type: boolean }
        sensitive: { type: boolean }
        sortOrder: { type: integer, minimum: -10000, maximum: 10000 }
        isActive: { type: boolean }
    PublicQuestion:
      type: object
      description: '`FormQuestion` without `serviceId` and `isActive`.'
      required: [id, label, helpText, kind, options, required, sensitive, sortOrder]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        helpText: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/QuestionKind' }
        options:
          type: array
          items: { type: string }
        required: { type: boolean }
        sensitive: { type: boolean }
        sortOrder: { type: integer }

    # ---------------------------------------------------------------- public services / availability
    SelectableResource:
      type: object
      required: [id, name, description, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/ResourceKind' }
    SelectableRequirement:
      type: object
      required: [id, label, resources]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        resources:
          type: array
          description: Active resources in the pool.
          items: { $ref: '#/components/schemas/SelectableResource' }
    PublicService:
      type: object
      required:
        - id
        - name
        - description
        - category
        - color
        - durationMinutes
        - bufferBeforeMinutes
        - bufferAfterMinutes
        - slotIntervalMinutes
        - minNoticeMinutes
        - maxAdvanceDays
        - capacity
        - priceCents
        - paymentMode
        - depositCents
        - allowPayAtVenue
        - requiresApproval
        - locationType
        - sortOrder
        - options
        - addons
        - allowedGroupIds
        - selectableRequirement
        - questions
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        color: { type: string }
        durationMinutes: { type: integer }
        bufferBeforeMinutes: { type: integer }
        bufferAfterMinutes: { type: integer }
        slotIntervalMinutes: { type: [integer, 'null'] }
        minNoticeMinutes: { type: [integer, 'null'] }
        maxAdvanceDays: { type: [integer, 'null'] }
        capacity: { type: integer }
        priceCents: { type: integer }
        paymentMode: { $ref: '#/components/schemas/PaymentMode' }
        depositCents: { type: [integer, 'null'] }
        allowPayAtVenue:
          type: boolean
          description: Paid online by default, but the customer may choose to pay at the venue (`CreatePublicBooking.payment`).
        requiresApproval: { type: boolean }
        locationType: { $ref: '#/components/schemas/LocationType' }
        sortOrder: { type: integer }
        options:
          type: array
          items: { $ref: '#/components/schemas/ServiceOption' }
        addons:
          type: array
          items: { $ref: '#/components/schemas/ServiceAddon' }
        allowedGroupIds:
          type: array
          items: { type: string, format: uuid }
        selectableRequirement:
          description: The requirement the customer can choose a resource for, if any.
          oneOf:
            - $ref: '#/components/schemas/SelectableRequirement'
            - type: 'null'
        questions:
          type: array
          description: Active questions for this service (business-wide plus service-specific).
          items: { $ref: '#/components/schemas/PublicQuestion' }
    Slot:
      type: object
      required: [start, end, resourceIds, seatsLeft]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        resourceIds:
          type: array
          description: One example assignment of resources.
          items: { type: string, format: uuid }
        seatsLeft: { type: [integer, 'null'], description: 'Remaining seats for capacity services. Otherwise `null`.' }
        offer:
          description: 'The deal discounting this slot (public and staff availability), priced for the requested option and add-ons; `null` otherwise.'
          oneOf:
            - $ref: '#/components/schemas/SlotOffer'
            - type: 'null'
    AvailabilityDay:
      type: object
      required: [date, slots, opensAt, held]
      properties:
        date: { type: string, format: date }
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }
        opensAt:
          type: [string, 'null']
          format: date-time
          description: 'Customer availability: the day has times but a release schedule keeps it closed until then (it has no slots). `null` otherwise, and always for staff.'
        held:
          type: boolean
          description: 'Customer availability: the day has times but its release is held (closed until the business opens it; no time set). Always false for staff.'
    Availability:
      type: object
      required: [timezone, from, to, durationMinutes, days, nextAvailableOnly]
      properties:
        timezone: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        durationMinutes: { type: integer, description: 'Effective duration including the option and add-ons.' }
        days:
          type: array
          description: Every day of the range, in order (a day with no free time has no slots).
          items: { $ref: '#/components/schemas/AvailabilityDay' }
        nextAvailableOnly:
          type: boolean
          description: 'True when the business offers only its next available time: `days` then hold at most one slot (customer availability only; always false for staff).'

    # ---------------------------------------------------------------- booking requests
    PublicCustomerInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, maxLength: 254 }
        phone:
          type: [string, 'null']
          pattern: '^\+?[0-9 ()\-]{6,20}$'
          description: Required when `policies.requireCustomerPhone` is true.
    CreatePublicBooking:
      type: object
      required: [serviceId, start, customer]
      properties:
        serviceId: { type: string, format: uuid }
        optionId: { type: [string, 'null'], format: uuid, description: 'Required if the service has options.' }
        addonIds:
          type: array
          default: []
          items: { type: string, format: uuid }
        groupId: { type: [string, 'null'], format: uuid }
        resourceId: { type: [string, 'null'], format: uuid, description: 'Choice for the customer-selectable requirement.' }
        start:
          type: string
          description: ISO-8601 with offset (preferred), or a local date-time interpreted in the business timezone.
          examples: ['2026-10-01T09:00:00+01:00']
        customer: { $ref: '#/components/schemas/PublicCustomerInput' }
        answers:
          type: object
          default: {}
          description: Maps question id to answer, at most 100 entries. Required questions are enforced.
          additionalProperties: { type: string, maxLength: 2000 }
        customerNotes: { type: [string, 'null'], maxLength: 2000 }
        returnUrl:
          type: [string, 'null']
          description: The frontend origin used to build the payment success/cancel URLs. Only allowed origins are used.
        payment:
          type: [string, 'null']
          enum: [online, at_venue, null]
          description: |
            `online` (the default) pays as the service says. `at_venue` books a service with `allowPayAtVenue` without paying
            online: the booking's `paymentStatus` is `pay_at_venue`. 400 `INVALID_REQUEST` (field `payment`) for a service
            that doesn't allow it.
        expectedTotalCents:
          type: [integer, 'null']
          minimum: 0
          description: |
            The total the customer was shown (the time's deal price when it had one, else the list price of the selection).
            When given and the booking would now cost something else (a capped deal's last redemption went, the price was
            changed), 409 `PRICE_CHANGED` is returned, with the new price in the message, and nothing is booked.
    CustomerInput:
      type: object
      description: Also used as `CreateStaffBooking.customer` (Kotlin `StaffCustomerInput`, which has the same shape).
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: [string, 'null'], maxLength: 254 }
        phone: { type: [string, 'null'], pattern: '^\+?[0-9 ()\-]{6,20}$' }
        notes: { type: [string, 'null'], maxLength: 5000, description: 'Max 2000 characters when used in `CreateStaffBooking`.' }
        groupId: { type: [string, 'null'], format: uuid }
    CustomerUpdate:
      type: object
      description: Partial update. Every field except `name` can be cleared with `null`.
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: [string, 'null'], maxLength: 254 }
        phone: { type: [string, 'null'], pattern: '^\+?[0-9 ()\-]{6,20}$' }
        notes: { type: [string, 'null'], maxLength: 5000 }
        groupId: { type: [string, 'null'], format: uuid }
    CreateStaffBooking:
      type: object
      required: [serviceId, start]
      description: Give `customerId` (an existing customer) or `customer` (new details). If both are given, `customerId` wins.
      properties:
        serviceId: { type: string, format: uuid }
        optionId: { type: [string, 'null'], format: uuid }
        addonIds:
          type: array
          default: []
          items: { type: string, format: uuid }
        groupId: { type: [string, 'null'], format: uuid }
        resourceIds:
          type: [array, 'null']
          description: Force specific resources. Staff may only choose their own.
          items: { type: string, format: uuid }
        start:
          type: string
          description: ISO-8601 with offset (preferred), or a local date-time interpreted in the business timezone.
        customerId: { type: [string, 'null'], format: uuid }
        customer:
          oneOf:
            - $ref: '#/components/schemas/CustomerInput'
            - type: 'null'
        answers:
          type: object
          default: {}
          additionalProperties: { type: string }
        internalNotes: { type: [string, 'null'], maxLength: 2000 }
        paymentMode:
          type: string
          enum: [collect_online, at_venue, none]
          default: at_venue
        notifyCustomer: { type: boolean, default: true }
    BookingUpdate:
      type: object
      description: Partial update. `answers` are merged into the existing answers and validated, but required questions are not enforced.
      properties:
        internalNotes: { type: [string, 'null'], maxLength: 2000 }
        customerNotes: { type: [string, 'null'], maxLength: 2000 }
        answers:
          type: object
          description: Maps question id to value. Must not be `null`.
          additionalProperties: { type: string }
    ReasonInput:
      type: object
      properties:
        reason: { type: [string, 'null'], description: 'Trimmed and truncated to 500 characters.' }
    CustomerRescheduleInput:
      type: object
      required: [start]
      properties:
        start: { type: string, description: 'ISO-8601 with offset, or a local date-time in the business timezone.' }
        resourceId: { type: [string, 'null'], format: uuid }
    StaffCancelInput:
      type: object
      properties:
        reason: { type: [string, 'null'], description: 'Trimmed and truncated to 500 characters.' }
        refund:
          type: string
          enum: [policy, full, none]
          default: policy
        notifyCustomer: { type: boolean, default: true }
    StaffRescheduleInput:
      type: object
      required: [start]
      properties:
        start: { type: string, description: 'ISO-8601 with offset, or a local date-time in the business timezone.' }
        resourceIds:
          type: [array, 'null']
          items: { type: string, format: uuid }
        notifyCustomer: { type: boolean, default: true }
    BookingStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [completed, no_show] }

    # ---------------------------------------------------------------- booking responses
    IdName:
      type: object
      required: [id, name]
      properties:
        id: { type: string, description: 'Usually a UUID. Can be `""` for an option snapshot whose id no longer exists.' }
        name: { type: string }
    ResourceRef:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/ResourceKind' }
    RefundPreview:
      type: object
      required: [amountCents, reason]
      properties:
        amountCents: { type: integer }
        reason: { type: string, description: 'A human-readable explanation of the refund policy outcome.' }
    BookingBusinessRef:
      type: object
      required: [id, slug, name, branding, contactEmail, contactPhone, address]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        branding: { $ref: '#/components/schemas/Branding' }
        contactEmail: { type: [string, 'null'] }
        contactPhone: { type: [string, 'null'] }
        address: { $ref: '#/components/schemas/Address' }
    CustomerBooking:
      type: object
      required:
        - id
        - reference
        - status
        - paymentStatus
        - start
        - end
        - timezone
        - business
        - service
        - option
        - addons
        - resources
        - priceCents
        - depositCents
        - amountPaidCents
        - amountPaidInPersonCents
        - amountRefundedCents
        - currency
        - holdExpiresAt
        - canCancel
        - canReschedule
        - refundPreview
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, description: 'e.g. `BA-7K3F9Q`.' }
        status: { $ref: '#/components/schemas/BookingStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        timezone: { type: string }
        business: { $ref: '#/components/schemas/BookingBusinessRef' }
        service: { $ref: '#/components/schemas/IdName' }
        option:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        addons:
          type: array
          items: { $ref: '#/components/schemas/IdName' }
        resources:
          type: array
          items: { $ref: '#/components/schemas/ResourceRef' }
        priceCents: { type: integer }
        depositCents: { type: [integer, 'null'] }
        amountPaidCents: { type: integer }
        amountPaidInPersonCents: { type: integer, description: "The part of `amountPaidCents` taken in person, which an online refund can't return." }
        amountRefundedCents: { type: integer }
        currency: { type: string }
        holdExpiresAt: { type: [string, 'null'], format: date-time, description: 'Only set while the status is `held`.' }
        canCancel: { type: boolean }
        canReschedule: { type: boolean }
        refundPreview:
          description: What cancelling now would refund. `null` if nothing is paid or the booking can't be cancelled.
          oneOf:
            - $ref: '#/components/schemas/RefundPreview'
            - type: 'null'
        originalPriceCents: { type: [integer, 'null'], description: 'Price before the applied deal; `priceCents` is what is owed. `null` without a deal.' }
        offer:
          oneOf:
            - $ref: '#/components/schemas/BookingOffer'
            - type: 'null'
    ContactRef:
      type: object
      description: >-
        Who the booking is for. For a booking made on the booking page or by an assistant, `name` and `phone` are null
        unless it was made by the signed-in account linked to the customer (anyone can book with an email address).
      required: [name, email, phone]
      properties:
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
    ManagedBooking:
      allOf:
        - $ref: '#/components/schemas/CustomerBooking'
        - type: object
          required: [customer]
          properties:
            customer: { $ref: '#/components/schemas/ContactRef' }
    NextStep:
      type: object
      required: [type, checkoutUrl]
      properties:
        type:
          type: string
          enum: [confirmed, pending_approval, payment_required, expired, cancelled]
          description: '`expired` and `cancelled` only when an Idempotency-Key replay finds the original booking over.'
        checkoutUrl: { type: [string, 'null'], description: 'Set when `type` is `payment_required`.' }
    BookingResult:
      type: object
      required: [booking, manageToken, next]
      properties:
        booking: { $ref: '#/components/schemas/CustomerBooking' }
        manageToken: { type: string, description: 'Secret for `/v1/public/manage/{token}`.' }
        next: { $ref: '#/components/schemas/NextStep' }
    MyBookings:
      type: object
      required: [upcoming, past]
      properties:
        upcoming:
          type: array
          items: { $ref: '#/components/schemas/CustomerBooking' }
        past:
          type: array
          items: { $ref: '#/components/schemas/CustomerBooking' }
    BookingCustomerRef:
      type: object
      required: [id, name, email, phone, groupId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        groupId: { type: [string, 'null'], format: uuid }
    ServiceRef:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
    AddonRef:
      type: object
      required: [id, name, extraMinutes, priceCents]
      properties:
        id: { type: string }
        name: { type: string }
        extraMinutes: { type: integer }
        priceCents: { type: integer }
    AllocatedResourceRef:
      type: object
      required: [id, name, kind, requirementId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/ResourceKind' }
        requirementId: { type: [string, 'null'], format: uuid }
    Answer:
      type: object
      required: [questionId, label, value, sensitive]
      properties:
        questionId: { type: string, format: uuid }
        label: { type: string }
        value: { type: string }
        sensitive: { type: boolean }
    Booking:
      type: object
      required:
        - id
        - reference
        - status
        - paymentStatus
        - source
        - start
        - end
        - bufferBeforeMinutes
        - bufferAfterMinutes
        - customer
        - service
        - option
        - addons
        - resources
        - groupId
        - answers
        - customerNotes
        - internalNotes
        - priceCents
        - depositCents
        - amountPaidCents
        - amountPaidInPersonCents
        - amountRefundedCents
        - currency
        - holdExpiresAt
        - cancelledAt
        - cancelledBy
        - cancellationReason
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        source: { $ref: '#/components/schemas/BookingSource' }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time, description: 'End of service time, excluding buffers.' }
        bufferBeforeMinutes: { type: integer }
        bufferAfterMinutes: { type: integer }
        customer: { $ref: '#/components/schemas/BookingCustomerRef' }
        service: { $ref: '#/components/schemas/ServiceRef' }
        option:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        addons:
          type: array
          items: { $ref: '#/components/schemas/AddonRef' }
        resources:
          type: array
          items: { $ref: '#/components/schemas/AllocatedResourceRef' }
        groupId: { type: [string, 'null'], format: uuid }
        answers:
          type: array
          items: { $ref: '#/components/schemas/Answer' }
        customerNotes: { type: [string, 'null'] }
        internalNotes: { type: [string, 'null'] }
        priceCents: { type: integer }
        depositCents: { type: [integer, 'null'] }
        amountPaidCents: { type: integer }
        amountPaidInPersonCents: { type: integer, description: "The part of `amountPaidCents` taken in person, which an online refund can't return." }
        amountRefundedCents: { type: integer }
        currency: { type: string }
        holdExpiresAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancelledBy:
          type: [string, 'null']
          enum: [customer, business, system, null]
        cancellationReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        originalPriceCents: { type: [integer, 'null'], description: 'Price before the applied deal; `priceCents` is what is owed. `null` without a deal.' }
        offer:
          oneOf:
            - $ref: '#/components/schemas/BookingOffer'
            - type: 'null'
    Payment:
      type: object
      required: [id, kind, provider, amountCents, currency, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [charge, refund] }
        provider: { type: string, description: 'e.g. `dev`, `stripe` or `in_person` (taken in person by staff; never refunded online).' }
        amountCents: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [pending, succeeded, failed, cancelled] }
        createdAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, actorType, actorName, action, entityType, entityId, summary, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorType: { $ref: '#/components/schemas/ActorType' }
        actorName: { type: [string, 'null'] }
        action: { type: string, description: 'e.g. `booking.created`.' }
        entityType: { type: string, description: 'e.g. `booking`, `resource`.' }
        entityId: { type: string, format: uuid }
        summary:
          type: object
          additionalProperties: true
        occurredAt: { type: string, format: date-time }
    CreatedBooking:
      description: '`POST /bookings` response: the booking plus its payment link when it is held for online payment.'
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          required: [checkoutUrl]
          properties:
            checkoutUrl:
              type: [string, 'null']
              description: Hosted checkout link for a `held` booking (`collect_online`). Otherwise `null`.
    PaymentLinkSent:
      type: object
      required: [checkoutUrl, sentTo]
      properties:
        checkoutUrl: { type: string }
        sentTo: { type: string, format: email }
    BookingDetail:
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          required: [payments, history, checkoutUrl]
          properties:
            checkoutUrl:
              type: [string, 'null']
              description: The pending checkout link while the booking is `held` and its hold has not expired. Otherwise `null`.
            payments:
              type: array
              items: { $ref: '#/components/schemas/Payment' }
            history:
              type: array
              description: Audit events for this booking, oldest first.
              items: { $ref: '#/components/schemas/AuditEvent' }
    BookingPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Booking' }
        nextCursor: { type: [string, 'null'] }
    AuditEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextCursor: { type: [string, 'null'] }

    # ---------------------------------------------------------------- customers
    Customer:
      type: object
      required: [id, name, email, phone, notes, groupId, hasAccount, bookingCount, lastBookingAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        groupId: { type: [string, 'null'], format: uuid }
        hasAccount: { type: boolean, description: 'Linked to a user account.' }
        bookingCount: { type: integer }
        lastBookingAt: { type: [string, 'null'], format: date-time, description: 'Start of the last visit: the latest completed or no-show booking (never an upcoming one).' }
        createdAt: { type: string, format: date-time }
    CustomerDetail:
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          required: [bookings]
          properties:
            bookings:
              type: array
              items: { $ref: '#/components/schemas/Booking' }
    CustomerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        nextCursor: { type: [string, 'null'] }
    CustomerExport:
      type: object
      required: [exportedAt, business, customer, bookings]
      properties:
        exportedAt: { type: string, format: date-time }
        business: { type: string, description: 'Business name.' }
        customer: { $ref: '#/components/schemas/Customer' }
        bookings:
          type: array
          items: { $ref: '#/components/schemas/Booking' }

    # ---------------------------------------------------------------- team
    TeamMember:
      type: object
      required: [id, userId, name, email, role, status, resourceId, createdAt]
      properties:
        id: { type: string, format: uuid, description: 'Membership id.' }
        userId: { type: [string, 'null'], format: uuid, description: '`null` while the invitation is pending.' }
        name: { type: [string, 'null'] }
        email: { type: string, description: 'The user''s email, or the invited email.' }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [invited, active] }
        resourceId: { type: [string, 'null'], format: uuid, description: 'The first linked resource.' }
        createdAt: { type: string, format: date-time }
    InvitationInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, maxLength: 254 }
        role: { $ref: '#/components/schemas/Role' }
        resourceId: { type: [string, 'null'], format: uuid, description: 'The resource to link to the new member.' }
    TeamMemberUpdate:
      type: object
      description: Partial update. `resourceId` set to `null` unlinks every resource.
      properties:
        role: { $ref: '#/components/schemas/Role' }
        resourceId: { type: [string, 'null'], format: uuid }

    # ---------------------------------------------------------------- me
    MeUser:
      type: object
      required: [id, email, name, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, description: '`""` if the identity has no email.' }
        name: { type: [string, 'null'] }
        emailVerified: { type: boolean }
    MeMembership:
      type: object
      required: [businessId, slug, name, role, branding]
      properties:
        businessId: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        branding: { $ref: '#/components/schemas/Branding' }
    MeInvitation:
      type: object
      required: [token, businessName, role]
      properties:
        token: { type: string, description: 'Use with `POST /v1/invitations/{token}/accept`.' }
        businessName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    Me:
      type: object
      required: [user, memberships, pendingInvitations, hasCustomerBookings]
      properties:
        user: { $ref: '#/components/schemas/MeUser' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MeMembership' }
        pendingInvitations:
          type: array
          items: { $ref: '#/components/schemas/MeInvitation' }
        hasCustomerBookings: { type: boolean }
    AcceptedInvitation:
      allOf:
        - $ref: '#/components/schemas/Me'
        - type: object
          required: [joinedBusinessId]
          properties:
            joinedBusinessId: { type: string, format: uuid, description: 'The business the invitation is for, among `memberships`.' }

    # ---------------------------------------------------------------- reports
    ReportTotals:
      type: object
      required: [bookings, confirmed, cancelled, noShows, revenueCents, refundedCents, newCustomers]
      properties:
        bookings: { type: integer }
        confirmed: { type: integer, description: 'Confirmed plus completed.' }
        cancelled: { type: integer }
        noShows: { type: integer }
        revenueCents: { type: integer, description: 'Paid minus refunded, plus completed pay-at-venue bookings.' }
        refundedCents: { type: integer }
        newCustomers: { type: integer }
    ReportDay:
      type: object
      required: [date, bookings, revenueCents]
      properties:
        date: { type: string, format: date }
        bookings: { type: integer }
        revenueCents: { type: integer }
    ReportService:
      type: object
      required: [serviceId, name, bookings, revenueCents]
      properties:
        serviceId: { type: string, format: uuid }
        name: { type: string }
        bookings: { type: integer }
        revenueCents: { type: integer }
    ReportResource:
      type: object
      required: [resourceId, name, bookedMinutes, availableMinutes, utilisation]
      properties:
        resourceId: { type: string, format: uuid }
        name: { type: string }
        bookedMinutes: { type: integer }
        availableMinutes: { type: integer }
        utilisation: { type: number, description: 'bookedMinutes / availableMinutes, rounded to 3 decimals. 0 when nothing is available.' }
    ReportSummary:
      type: object
      required: [from, to, currency, totals, byDay, byService, byResource]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        currency: { type: string }
        totals: { $ref: '#/components/schemas/ReportTotals' }
        byDay:
          type: array
          description: One entry per day in the range, including days with no bookings.
          items: { $ref: '#/components/schemas/ReportDay' }
        byService:
          type: array
          items: { $ref: '#/components/schemas/ReportService' }
        byResource:
          type: array
          description: Active resources only.
          items: { $ref: '#/components/schemas/ReportResource' }

    # ---------------------------------------------------------------- payments / billing
    PaymentsStatus:
      type: object
      required: [provider, connected, chargesEnabled, detailsSubmitted]
      properties:
        provider:
          type: string
          enum: [stripe, dev, none]
          description: The current server only returns `dev` or `none`. `stripe` is reserved for the Stripe provider.
        connected: { type: boolean }
        chargesEnabled: { type: boolean }
        detailsSubmitted: { type: boolean }
    ReturnUrlInput:
      type: object
      required: [returnUrl]
      properties:
        returnUrl:
          type: string
          maxLength: 500
          description: An http(s) URL on the app origin (`APP_BASE_URL`) or an allowed CORS origin.
    BillingCheckoutInput:
      type: object
      required: [plan, returnUrl]
      properties:
        plan: { type: string, enum: [pro, business] }
        returnUrl: { type: string, maxLength: 500 }
    BillingUsage:
      type: object
      required: [bookingsThisMonth, limit]
      properties:
        bookingsThisMonth: { type: integer }
        limit: { type: [integer, 'null'], description: '100 on the Free plan. `null` means unlimited.' }
    PlanPrice:
      type: object
      required: [plan, name, amountCents, currency, interval, features]
      properties:
        plan: { $ref: '#/components/schemas/Plan' }
        name: { type: string }
        amountCents: { type: integer }
        currency: { type: string }
        interval: { type: string, description: 'Currently always `month`.' }
        features:
          type: array
          items: { type: string }
    Billing:
      type: object
      required: [plan, status, usage, prices]
      properties:
        plan: { $ref: '#/components/schemas/Plan' }
        status: { type: string, description: 'Subscription status. Defaults to `active`.' }
        usage: { $ref: '#/components/schemas/BillingUsage' }
        prices:
          type: array
          items: { $ref: '#/components/schemas/PlanPrice' }
    DevPaymentView:
      type: object
      required: [payment, booking, business]
      properties:
        payment: { $ref: '#/components/schemas/Payment' }
        booking: { $ref: '#/components/schemas/ManagedBooking' }
        business: { $ref: '#/components/schemas/PublicBusiness' }
    DevPaymentOutcome:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [succeeded, cancelled] }

    # ---------------------------------------------------------------- templates / onboarding
    TemplateSummary:
      type: object
      required: [key, name, description, icon]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string, description: 'Lucide icon name.' }
    BusinessDraftRequest:
      type: object
      required: [description]
      properties:
        description: { type: string, maxLength: 4000 }
        websiteUrl: { type: [string, 'null'], maxLength: 500 }
    SetupCustomerGroup:
      type: object
      required: [key, name, description, restricted]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        restricted: { type: boolean }
    SetupWeeklyHours:
      type: object
      required: [dayOfWeek, startTime, endTime, audienceGroupKeys]
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
        startTime: { type: string }
        endTime: { type: string }
        audienceGroupKeys:
          type: array
          items: { type: string }
    SetupResource:
      type: object
      required: [key, kind, name, description, capacity, weeklyHours]
      properties:
        key: { type: string }
        kind: { $ref: '#/components/schemas/ResourceKind' }
        name: { type: string }
        description: { type: [string, 'null'] }
        capacity: { type: integer }
        weeklyHours:
          type: array
          items: { $ref: '#/components/schemas/SetupWeeklyHours' }
    SetupRequirement:
      type: object
      required: [label, quantity, customerSelectable, resourceKeys]
      properties:
        label: { type: string }
        quantity: { type: integer }
        customerSelectable: { type: boolean }
        resourceKeys:
          type: array
          items: { type: string }
    SetupServiceOption:
      type: object
      description: A service option inside a setup, as serialized by the server (`id` is usually `null`).
      required: [id, name, description, durationMinutes, priceCents, sortOrder]
      properties:
        id: { type: [string, 'null'] }
        name: { type: string }
        description: { type: [string, 'null'] }
        durationMinutes: { type: integer }
        priceCents: { type: integer }
        sortOrder: { type: integer }
    SetupServiceAddon:
      type: object
      description: A service add-on inside a setup, as serialized by the server (`id` is usually `null`).
      required: [id, name, description, extraMinutes, priceCents, sortOrder]
      properties:
        id: { type: [string, 'null'] }
        name: { type: string }
        description: { type: [string, 'null'] }
        extraMinutes: { type: integer }
        priceCents: { type: integer }
        sortOrder: { type: integer }
    SetupService:
      type: object
      required:
        - name
        - description
        - category
        - color
        - durationMinutes
        - bufferBeforeMinutes
        - bufferAfterMinutes
        - slotIntervalMinutes
        - minNoticeMinutes
        - maxAdvanceDays
        - capacity
        - priceCents
        - paymentMode
        - depositCents
        - requiresApproval
        - locationType
        - isPublic
        - options
        - addons
        - requirements
        - allowedGroupKeys
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        color: { type: string }
        durationMinutes: { type: integer }
        bufferBeforeMinutes: { type: integer }
        bufferAfterMinutes: { type: integer }
        slotIntervalMinutes: { type: [integer, 'null'] }
        minNoticeMinutes: { type: [integer, 'null'] }
        maxAdvanceDays: { type: [integer, 'null'] }
        capacity: { type: integer }
        priceCents: { type: integer }
        paymentMode: { $ref: '#/components/schemas/PaymentMode' }
        depositCents: { type: [integer, 'null'] }
        requiresApproval: { type: boolean }
        locationType: { $ref: '#/components/schemas/LocationType' }
        isPublic: { type: boolean }
        options:
          type: array
          items: { $ref: '#/components/schemas/SetupServiceOption' }
        addons:
          type: array
          items: { $ref: '#/components/schemas/SetupServiceAddon' }
        requirements:
          type: array
          items: { $ref: '#/components/schemas/SetupRequirement' }
        allowedGroupKeys:
          type: array
          items: { type: string }
    SetupQuestion:
      type: object
      required: [label, helpText, kind, options, required, sensitive, serviceName]
      properties:
        label: { type: string }
        helpText: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/QuestionKind' }
        options:
          type: array
          items: { type: string }
        required: { type: boolean }
        sensitive: { type: boolean }
        serviceName: { type: [string, 'null'], description: '`null` means the question applies to every service.' }
    BusinessSetup:
      type: object
      description: A complete description of a business, as returned by templates and AI drafts. It can be edited and sent to `POST /v1/businesses`.
      required:
        - source
        - name
        - slug
        - industry
        - description
        - timezone
        - currency
        - locale
        - country
        - vocabulary
        - branding
        - policies
        - customerGroups
        - resources
        - services
        - questions
      properties:
        source: { type: [string, 'null'], description: '`"template"` for templates and template-based drafts, `"ai"` for AI drafts.' }
        name: { type: string }
        slug: { type: [string, 'null'] }
        industry: { type: string }
        description: { type: [string, 'null'] }
        timezone: { type: string }
        currency: { type: string }
        locale: { type: string }
        country: { type: string }
        vocabulary: { $ref: '#/components/schemas/Vocabulary' }
        branding: { $ref: '#/components/schemas/Branding' }
        policies: { $ref: '#/components/schemas/Policies' }
        customerGroups:
          type: array
          items: { $ref: '#/components/schemas/SetupCustomerGroup' }
        resources:
          type: array
          items: { $ref: '#/components/schemas/SetupResource' }
        services:
          type: array
          items: { $ref: '#/components/schemas/SetupService' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/SetupQuestion' }
    SetupCustomerGroupInput:
      type: object
      required: [key, name]
      properties:
        key: { type: string, maxLength: 50, description: 'Unique within the setup.' }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 500 }
        restricted: { type: boolean, default: false }
    SetupWeeklyHoursInput:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):([0-5]\d)(:00)?$' }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):([0-5]\d)(:00)?$' }
        audienceGroupKeys:
          type: array
          default: []
          items: { type: string }
    SetupResourceInput:
      type: object
      required: [key, kind, name]
      properties:
        key: { type: string, maxLength: 50, description: 'Unique within the setup.' }
        kind: { $ref: '#/components/schemas/ResourceKind' }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 1000 }
        capacity: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        weeklyHours:
          type: array
          default: []
          items: { $ref: '#/components/schemas/SetupWeeklyHoursInput' }
    SetupRequirementInput:
      type: object
      required: [label, resourceKeys]
      properties:
        label: { type: string, maxLength: 100 }
        quantity: { type: integer, minimum: 1, maximum: 20, default: 1 }
        customerSelectable: { type: boolean, default: false }
        resourceKeys:
          type: array
          items: { type: string }
    SetupServiceInput:
      type: object
      required: [name, durationMinutes]
      properties:
        name: { type: string, maxLength: 120, description: 'Unique within the setup (case-insensitive).' }
        description: { type: [string, 'null'], maxLength: 2000 }
        category: { type: [string, 'null'], maxLength: 60 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', default: '#4f46e5' }
        durationMinutes: { type: integer, minimum: 5, maximum: 1440 }
        bufferBeforeMinutes: { type: integer, minimum: 0, maximum: 480, default: 0 }
        bufferAfterMinutes: { type: integer, minimum: 0, maximum: 480, default: 0 }
        slotIntervalMinutes: { type: [integer, 'null'], minimum: 5, maximum: 1440 }
        minNoticeMinutes: { type: [integer, 'null'], minimum: 0, maximum: 129600 }
        maxAdvanceDays: { type: [integer, 'null'], minimum: 1, maximum: 730 }
        capacity: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        priceCents: { type: integer, minimum: 0, maximum: 10000000, default: 0 }
        paymentMode: { allOf: [{ $ref: '#/components/schemas/PaymentMode' }], default: full }
        depositCents: { type: [integer, 'null'] }
        requiresApproval: { type: boolean, default: false }
        locationType: { allOf: [{ $ref: '#/components/schemas/LocationType' }], default: business }
        isPublic: { type: boolean, default: true }
        options:
          type: array
          default: []
          items: { $ref: '#/components/schemas/ServiceOptionInput' }
        addons:
          type: array
          default: []
          items: { $ref: '#/components/schemas/ServiceAddonInput' }
        requirements:
          type: array
          default: []
          items: { $ref: '#/components/schemas/SetupRequirementInput' }
        allowedGroupKeys:
          type: array
          default: []
          items: { type: string }
    SetupQuestionInput:
      type: object
      required: [label]
      properties:
        label: { type: string, maxLength: 200 }
        helpText: { type: [string, 'null'], maxLength: 500 }
        kind: { allOf: [{ $ref: '#/components/schemas/QuestionKind' }], default: text }
        options:
          type: array
          default: []
          items: { type: string }
        required: { type: boolean, default: false }
        sensitive: { type: boolean, default: false }
        serviceName: { type: [string, 'null'], description: 'Must match a service name in this setup.' }
    BusinessSetupInput:
      type: object
      description: Request form of `BusinessSetup`. A `BusinessSetup` returned by the API is always a valid `BusinessSetupInput`.
      required: [name]
      properties:
        source: { type: [string, 'null'], description: 'Free text recorded in the audit log, e.g. `template` or `ai`.' }
        name: { type: string, maxLength: 100 }
        slug:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{1,48}[a-z0-9]$'
          description: If omitted, a slug is derived from the name. If taken, the response is 409 `SLUG_TAKEN`.
        industry: { type: string, maxLength: 50, default: generic }
        description: { type: [string, 'null'], maxLength: 2000 }
        timezone: { type: string, default: Europe/Dublin }
        currency: { type: string, pattern: '^[A-Z]{3}$', default: EUR }
        locale: { type: string, pattern: '^[a-z]{2,3}(-[A-Z]{2})?$', default: en-IE }
        country: { type: string, pattern: '^[A-Z]{2}$', default: IE }
        vocabulary: { $ref: '#/components/schemas/VocabularyInput' }
        branding: { $ref: '#/components/schemas/BrandingInput' }
        policies: { $ref: '#/components/schemas/PoliciesInput' }
        customerGroups:
          type: array
          default: []
          items: { $ref: '#/components/schemas/SetupCustomerGroupInput' }
        resources:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/SetupResourceInput' }
        services:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/SetupServiceInput' }
        questions:
          type: array
          default: []
          items: { $ref: '#/components/schemas/SetupQuestionInput' }

    # ---------------------------------------------------------------- sites (section 15)
    SiteThemeKey:
      type: string
      enum: [clinical, calm, bold, playful, editorial, minimal]
    SiteSectionType:
      type: string
      enum: [hero, services, team, about, gallery, testimonials, faq, hours, cta, contact]
    GeneratedPattern:
      type: string
      enum: [aurora, mesh, waves, grid, dots, rays]
    HeroVariant:
      type: string
      enum: [split, cover, minimal]
    SiteAttribution:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name: { type: string, maxLength: 100 }
        url: { type: string, maxLength: 500, pattern: '^https://unsplash\.com/', description: Photographer's Unsplash profile. }
    SiteImage:
      type: object
      additionalProperties: false
      required: [kind]
      description: |
        `upload`: `url` under this business's upload prefix (`{prefix}{uuid}.{png|jpg|webp}`). `stock`: `url` on
        `https://images.unsplash.com/` and an `attribution`. `generated`: a `pattern` and no `url`. Fields that don't
        apply to the kind are normalized to `null`.
      properties:
        kind: { type: string, enum: [upload, stock, generated] }
        url: { type: [string, 'null'] }
        alt: { type: string, maxLength: 140, default: '' }
        pattern:
          oneOf:
            - $ref: '#/components/schemas/GeneratedPattern'
            - type: 'null'
        attribution:
          oneOf:
            - $ref: '#/components/schemas/SiteAttribution'
            - type: 'null'
    SitePalette:
      type: object
      additionalProperties: false
      required: [primaryColor]
      properties:
        primaryColor:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Needs 3:1 against white and white or ink (`#1c1917`) text on it at 4.5:1. Stored lowercase.
        accent:
          type: [string, 'null']
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Needs 3:1 against white.
    SiteSeo:
      type: object
      additionalProperties: false
      properties:
        title: { type: [string, 'null'], maxLength: 70 }
        description: { type: [string, 'null'], maxLength: 160 }
    HeroContent:
      type: object
      additionalProperties: false
      required: [headline]
      properties:
        variant: { $ref: '#/components/schemas/HeroVariant', default: split }
        eyebrow: { type: [string, 'null'], maxLength: 60 }
        headline: { type: string, minLength: 1, maxLength: 90 }
        subheadline: { type: [string, 'null'], maxLength: 240 }
        ctaLabel: { type: [string, 'null'], maxLength: 30, default: Book now, description: 'Missing → "Book now"; explicit null stays null.' }
        image:
          oneOf:
            - $ref: '#/components/schemas/SiteImage'
            - type: 'null'
    ServicesContent:
      type: object
      additionalProperties: false
      properties:
        heading: { type: string, maxLength: 80, default: Services }
        intro: { type: [string, 'null'], maxLength: 300 }
        serviceIds:
          type: array
          maxItems: 100
          default: []
          description: Ids of this business's services in display order (duplicates removed); empty = all public services.
          items: { type: string, format: uuid }
        showPrices: { type: boolean, default: true }
        showDurations: { type: boolean, default: true }
    SiteTeamMember:
      type: object
      additionalProperties: false
      required: [resourceId]
      properties:
        resourceId: { type: string, format: uuid, description: An active person resource of this business, listed once. }
        bio: { type: [string, 'null'], maxLength: 400 }
        photo:
          oneOf:
            - $ref: '#/components/schemas/SiteImage'
            - type: 'null'
    TeamContent:
      type: object
      additionalProperties: false
      properties:
        heading: { type: string, maxLength: 80, default: Meet the team }
        intro: { type: [string, 'null'], maxLength: 300 }
        members:
          type: array
          maxItems: 24
          default: []
          description: Empty = all active people.
          items: { $ref: '#/components/schemas/SiteTeamMember' }
    AboutContent:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        heading: { type: string, maxLength: 80, default: About us }
        body: { type: string, minLength: 1, maxLength: 1500, description: 'Plain text; "\n\n" separates paragraphs.' }
        highlights:
          type: array
          maxItems: 4
          default: []
          items: { type: string, minLength: 1, maxLength: 60 }
        image:
          oneOf:
            - $ref: '#/components/schemas/SiteImage'
            - type: 'null'
    GalleryContent:
      type: object
      additionalProperties: false
      properties:
        heading: { type: [string, 'null'], maxLength: 80 }
        images:
          type: array
          maxItems: 12
          default: []
          items: { $ref: '#/components/schemas/SiteImage' }
    Testimonial:
      type: object
      additionalProperties: false
      required: [quote, author]
      properties:
        quote: { type: string, minLength: 1, maxLength: 400 }
        author: { type: string, minLength: 1, maxLength: 60 }
        detail: { type: [string, 'null'], maxLength: 60 }
    TestimonialsContent:
      type: object
      additionalProperties: false
      properties:
        heading: { type: string, maxLength: 80, default: What our customers say }
        items:
          type: array
          maxItems: 8
          default: []
          description: Only ever written by the owner; AI output never contains items.
          items: { $ref: '#/components/schemas/Testimonial' }
    FaqItem:
      type: object
      additionalProperties: false
      required: [question, answer]
      properties:
        question: { type: string, minLength: 1, maxLength: 140 }
        answer: { type: string, minLength: 1, maxLength: 600 }
    FaqContent:
      type: object
      additionalProperties: false
      properties:
        heading: { type: string, maxLength: 80, default: Frequently asked questions }
        items:
          type: array
          maxItems: 12
          default: []
          items: { $ref: '#/components/schemas/FaqItem' }
    HoursContent:
      type: object
      additionalProperties: false
      properties:
        heading: { type: string, maxLength: 80, default: Opening hours }
        note: { type: [string, 'null'], maxLength: 200 }
        showAddress: { type: boolean, default: true }
        showMapLink: { type: boolean, default: true }
    CtaContent:
      type: object
      additionalProperties: false
      required: [headline]
      properties:
        headline: { type: string, minLength: 1, maxLength: 90 }
        body: { type: [string, 'null'], maxLength: 240 }
        buttonLabel: { type: string, minLength: 1, maxLength: 30, default: Book now }
    ContactContent:
      type: object
      additionalProperties: false
      properties:
        heading: { type: string, maxLength: 80, default: Get in touch }
        body: { type: [string, 'null'], maxLength: 300 }
        showPhone: { type: boolean, default: true }
        showEmail: { type: boolean, default: true }
        showAddress: { type: boolean, default: true }
    SiteSection:
      type: object
      additionalProperties: false
      required: [id, type]
      description: '`content` has the schema of its `type` (e.g. `HeroContent` for `hero`); missing content = all defaults.'
      properties:
        id: { type: string, pattern: '^[a-z0-9-]{1,40}$', description: Unique within the plan. }
        type: { $ref: '#/components/schemas/SiteSectionType' }
        enabled: { type: boolean, default: true }
        content:
          oneOf:
            - $ref: '#/components/schemas/HeroContent'
            - $ref: '#/components/schemas/ServicesContent'
            - $ref: '#/components/schemas/TeamContent'
            - $ref: '#/components/schemas/AboutContent'
            - $ref: '#/components/schemas/GalleryContent'
            - $ref: '#/components/schemas/TestimonialsContent'
            - $ref: '#/components/schemas/FaqContent'
            - $ref: '#/components/schemas/HoursContent'
            - $ref: '#/components/schemas/CtaContent'
            - $ref: '#/components/schemas/ContactContent'
    SitePlan:
      type: object
      additionalProperties: false
      required: [theme, palette]
      description: |
        Validated strictly (section 15.4). Text is trimmed; control and bidi-override characters are rejected;
        single-line fields collapse whitespace. Responses always contain every field (explicit nulls, defaults filled).
      properties:
        theme: { $ref: '#/components/schemas/SiteThemeKey' }
        palette: { $ref: '#/components/schemas/SitePalette' }
        seo: { $ref: '#/components/schemas/SiteSeo' }
        sections:
          type: array
          maxItems: 16
          default: []
          description: Page order; at most one hero.
          items: { $ref: '#/components/schemas/SiteSection' }
    SiteContext:
      type: object
      required: [team, openingHours]
      properties:
        team:
          type: array
          description: Active person resources in sort order.
          items:
            type: object
            required: [id, name, description]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              description: { type: [string, 'null'] }
        openingHours:
          type: array
          description: Monday..Sunday (7 entries); the union of all active resources' weekly rules valid today (audiences ignored). Empty = closed.
          items:
            type: object
            required: [dayOfWeek, intervals]
            properties:
              dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
              intervals:
                type: array
                items:
                  type: object
                  required: [start, end]
                  properties:
                    start: { type: string, example: '09:00' }
                    end: { type: string, example: '17:30' }
    PublicSite:
      type: object
      required: [plan, isDefault, context]
      properties:
        plan: { $ref: '#/components/schemas/SitePlan' }
        isDefault: { type: boolean, description: True when nothing is published and the plan is the generated default. }
        context: { $ref: '#/components/schemas/SiteContext' }
    SiteAiStatus:
      type: object
      required: [model, credits]
      properties:
        model: { type: boolean, description: An AI model is configured (otherwise the built-in generator and editor are used, free and unlimited). }
        credits: { $ref: '#/components/schemas/AiCredits' }
    SiteState:
      type: object
      required: [draft, draftVersion, published, publishedVersion, publishedAt, updatedAt, hasUnpublishedChanges, context, ai, stock, uploads]
      properties:
        draft: { $ref: '#/components/schemas/SitePlan' }
        draftVersion: { type: [integer, 'null'], description: null = never saved (the draft is the default plan). }
        published:
          oneOf:
            - $ref: '#/components/schemas/SitePlan'
            - type: 'null'
        publishedVersion: { type: [integer, 'null'] }
        publishedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
        hasUnpublishedChanges: { type: boolean }
        context: { $ref: '#/components/schemas/SiteContext' }
        ai: { $ref: '#/components/schemas/SiteAiStatus' }
        stock:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
        uploads:
          type: object
          required: [enabled, maxBytes]
          properties:
            enabled: { type: boolean }
            maxBytes: { type: integer, example: 5242880 }
    SiteVersionSource:
      type: string
      enum: [owner, ai_generate, ai_edit, restore, template, seed]
    SiteVersion:
      type: object
      required: [version, source, instruction, changes, actorType, actorName, createdAt, isPublished, isDraft]
      properties:
        version: { type: integer, minimum: 1 }
        source: { $ref: '#/components/schemas/SiteVersionSource' }
        instruction: { type: [string, 'null'], description: The owner's prompt or instruction for AI versions. }
        changes:
          type: array
          items: { type: string }
          example: ['Theme: Calm → Bold', 'Added section: FAQ', 'Moved Testimonials up']
        actorType: { $ref: '#/components/schemas/ActorType' }
        actorName: { type: [string, 'null'], description: 'The user (for `ai`, the user the assistant acted for).' }
        createdAt: { type: string, format: date-time }
        isPublished: { type: boolean }
        isDraft: { type: boolean }
    SiteVersionDetail:
      allOf:
        - $ref: '#/components/schemas/SiteVersion'
        - type: object
          required: [plan]
          properties:
            plan: { $ref: '#/components/schemas/SitePlan' }
    SiteVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SiteVersion' }
    SiteAiResult:
      type: object
      required: [state, source, changes, previousVersion, message]
      properties:
        state: { $ref: '#/components/schemas/SiteState' }
        source: { type: string, enum: [ai, template] }
        changes:
          type: array
          items: { type: string }
          description: Empty when nothing changed (no version was saved).
        previousVersion: { type: [integer, 'null'], description: The draft version before this request; restore it to undo. }
        message: { type: [string, 'null'], description: Set when the built-in generator/editor was used or nothing changed. }
    SaveSiteInput:
      type: object
      required: [plan]
      properties:
        plan: { $ref: '#/components/schemas/SitePlan' }
        baseVersion: { type: [integer, 'null'], description: The draftVersion the edit started from; stale → 409 CONFLICT. }
    GenerateSiteInput:
      type: object
      properties:
        prompt: { type: [string, 'null'], maxLength: 2000 }
        websiteUrl: { type: [string, 'null'], maxLength: 500, description: 'http(s) URL fetched server-side as untrusted context.' }
    EditSiteInput:
      type: object
      required: [instruction]
      properties:
        instruction: { type: string, minLength: 1, maxLength: 500 }
        baseVersion: { type: [integer, 'null'] }
    StockPhoto:
      type: object
      required: [id, url, thumbUrl, width, height, color, alt, attribution, downloadLocation]
      properties:
        id: { type: string }
        url: { type: string, description: '`urls.regular` on images.unsplash.com (hotlinked).' }
        thumbUrl: { type: string }
        width: { type: integer }
        height: { type: integer }
        color: { type: [string, 'null'], description: Dominant colour, lowercase hex. }
        alt: { type: string, maxLength: 140 }
        attribution: { $ref: '#/components/schemas/SiteAttribution' }
        downloadLocation: { type: string, description: Pass to `POST /site/stock/download` when the photo is chosen. }
    StockSearchResult:
      type: object
      required: [enabled, results]
      properties:
        enabled: { type: boolean }
        results:
          type: array
          items: { $ref: '#/components/schemas/StockPhoto' }
    StockDownloadInput:
      type: object
      required: [downloadLocation]
      properties:
        downloadLocation: { type: string, pattern: '^https://api\.unsplash\.com/photos/' }
    Upload:
      type: object
      required: [url, contentType, bytes, width, height]
      properties:
        url: { type: string }
        contentType: { type: string, enum: [image/png, image/jpeg, image/webp] }
        bytes: { type: integer, description: Size after metadata was stripped. }
        width: { type: integer }
        height: { type: integer }
    # ---------------------------------------------------------------- AI credits (section 16)
    AiCredits:
      type: object
      description: A business's AI credits this month (two decimals).
      required: [limit, used, remaining, runningLow, limitReached, resetsOn, overage]
      properties:
        limit: { type: number }
        used: { type: number }
        remaining: { type: number }
        runningLow: { type: boolean, description: A fifth or less of the allowance left. }
        limitReached: { type: boolean, description: Used up and no metered overage; AI requests answer 409 `AI_LIMIT_REACHED`. }
        resetsOn: { type: string, format: date, description: First day of the next period (business timezone). }
        overage: { type: boolean, description: Usage past the allowance is billed through a Stripe meter instead of refused. }
    AiUsage:
      type: object
      required: [plan, timezone, periodStart, periodEnd, credits, model, byFeature, daily]
      properties:
        plan: { type: string, enum: [free, pro, business] }
        timezone: { type: string }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date, description: Last day of the period (inclusive). }
        credits: { $ref: '#/components/schemas/AiCredits' }
        model:
          type: object
          required: [configured, name]
          properties:
            configured: { type: boolean }
            name: { type: [string, 'null'] }
        byFeature:
          type: array
          items:
            type: object
            required: [feature, label, credits, requests]
            properties:
              feature: { type: string, enum: [business_draft, site_generate, site_edit, assistant] }
              label: { type: string }
              credits: { type: number }
              requests: { type: integer }
        daily:
          type: array
          description: Every day from the start of the period to today.
          items:
            type: object
            required: [date, credits]
            properties:
              date: { type: string, format: date }
              credits: { type: number }
    # ---------------------------------------------------------------- Bo (section 17)
    AssistantState:
      type: object
      required: [configured, credits, nudges, threads, canEditMemory]
      properties:
        configured: { type: boolean, description: A model is connected. }
        credits: { $ref: '#/components/schemas/AiCredits' }
        nudges:
          type: array
          description: Owners and admins only (empty for staff).
          items: { $ref: '#/components/schemas/Nudge' }
        threads:
          type: array
          items: { $ref: '#/components/schemas/AssistantThreadSummary' }
        canEditMemory: { type: boolean }
    Nudge:
      type: object
      required: [id, kind, severity, title, body, prompt, action, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [pending_approvals, no_show_streak, quiet_tomorrow, payments_not_set_up, site_not_published, ai_credits_low] }
        severity: { type: string, enum: [info, warning] }
        title: { type: string }
        body: { type: string }
        prompt: { type: string, description: Starts a conversation with Bo about it. }
        action: { oneOf: [{ $ref: '#/components/schemas/AssistantLink' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
    AssistantLink:
      type: object
      required: [label, path]
      properties:
        label: { type: string }
        path: { type: string, description: 'Dashboard path relative to `/dashboard/{slug}/`, e.g. `calendar?date=2026-10-06`.' }
    AssistantThreadSummary:
      type: object
      required: [id, title, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        updatedAt: { type: string, format: date-time }
    AssistantThread:
      type: object
      required: [id, title, createdAt, updatedAt, messages]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messages:
          type: array
          items: { $ref: '#/components/schemas/AssistantMessage' }
    AssistantMessage:
      type: object
      description: One chat bubble - the member's message, or everything Bo said and did in reply.
      required: [id, role, text, tools, actions, notice, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        text: { type: string, description: 'Plain text with light formatting (paragraphs, "- " lists, **bold**).' }
        tools:
          type: array
          items: { $ref: '#/components/schemas/AssistantToolActivity' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/AssistantAction' }
        notice:
          oneOf:
            - type: 'null'
            - type: object
              required: [kind, message]
              properties:
                kind: { type: string, enum: [refusal, truncated, error] }
                message: { type: string }
        createdAt: { type: string, format: date-time }
    AssistantToolActivity:
      type: object
      required: [id, name, label, status]
      properties:
        id: { type: string }
        name: { type: string, example: get_schedule }
        label: { type: string, example: Checking the schedule }
        status: { type: string, enum: [running, done, error] }
        summary: { type: [string, 'null'], example: Found 4 bookings }
    Notification:
      type: object
      required: [id, kind, title, body, link, businessName, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [agent_approval, booking_request, new_booking, booking_cancelled, booking_moved] }
        title: { type: string }
        body: { type: [string, 'null'] }
        link: { type: string, description: 'App path to open, e.g. /dashboard/lumen-physio/approvals/<id>.' }
        businessName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
    NotificationSettings:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [kind, label, description, email, forMembers, forCustomers]
            properties:
              kind: { type: string, enum: [agent_approval, booking_request, new_booking, booking_cancelled, booking_moved] }
              label: { type: string }
              description: { type: string }
              email: { type: boolean }
              forMembers: { type: boolean }
              forCustomers: { type: boolean }
    PushDeviceInput:
      type: object
      required: [token, platform, appVariant]
      properties:
        token:
          type: string
          maxLength: 200
          pattern: '^Expo(nent)?PushToken\[[!-\\^-~]+\]$'
          description: The phone's Expo push token (`getExpoPushTokenAsync`), e.g. `ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]`.
          example: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
        platform: { type: string, enum: [ios, android] }
        appVariant: { type: string, enum: [development, preview, production], description: Which build of the app (each is its own app to Expo). }
    PushDeviceDelete:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 200, description: The phone's Expo push token. }
    PushDevice:
      type: object
      description: A phone that gets the signed-in person's notifications. The token itself is never returned.
      required: [id, platform, appVariant, createdAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        appVariant: { type: string, enum: [development, preview, production] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time, description: When the app last registered it. }
    CustomerAgentRequest:
      type: object
      description: One of the customer's AI apps' requests (section 20.8), in the shape of a business proposal; result links are app paths or full URLs.
      required: [action, app, business, timezone, needsApproval, appDisconnected]
      properties:
        action: { $ref: '#/components/schemas/AssistantAction' }
        app: { type: string }
        timezone: { type: string, description: The business's IANA timezone (the times are in it). }
        business:
          type: object
          required: [name, slug]
          properties:
            name: { type: string }
            slug: { type: string }
        needsApproval: { type: boolean }
        appDisconnected: { type: boolean }
    CustomerAgentSettings:
      type: object
      required: [autoApprove]
      properties:
        autoApprove: { type: array, items: { type: string, enum: [bookings, cancellations] } }
    AgentChangeKind:
      type: string
      enum: [records, bookings, cancellations, time_off, settings]
      description: |
        A kind of change a member's AI app can propose: `records` (booking notes, customer records), `bookings` (new
        bookings, moves, approving requests, outcomes, payments in person, payment links), `cancellations` (cancelling and
        declining, which may refund), `time_off` (blocking time, closing dates, removing them), `settings` (opening hours,
        services, deals). A change to several bookings at once always needs approval.
    AgentRequest:
      type: object
      description: One of the member's AI apps' proposals (section 20.8).
      required: [action, app, needsApproval, appDisconnected]
      properties:
        action: { $ref: '#/components/schemas/AssistantAction' }
        app: { type: string, description: The app's name as it registered, e.g. Claude. }
        needsApproval: { type: boolean, description: "True: only the member can carry it out, here. False: the app may confirm it." }
        appDisconnected: { type: boolean, description: The app was disconnected since; its proposals can't go ahead. }
    AssistantAction:
      type: object
      description: A proposal from a write tool. Nothing changes until it is confirmed.
      required: [id, tool, status, proposal, result, error, expiresAt, createdAt, decidedAt]
      properties:
        id: { type: string, format: uuid }
        tool: { type: string, example: create_booking }
        status: { type: string, enum: [pending, confirmed, rejected, expired, failed] }
        proposal:
          type: object
          required: [title, summary, changes, items, warnings, confirmLabel, destructive]
          properties:
            title: { type: string }
            summary: { type: string }
            changes:
              type: array
              items:
                type: object
                required: [label, before, after]
                properties:
                  label: { type: string }
                  before: { type: [string, 'null'] }
                  after: { type: [string, 'null'] }
            items:
              type: array
              description: Every affected item of a bulk change.
              items:
                type: object
                required: [title, detail]
                properties:
                  title: { type: string }
                  detail: { type: [string, 'null'] }
            warnings: { type: array, items: { type: string } }
            confirmLabel: { type: string }
            destructive: { type: boolean }
        result:
          oneOf:
            - type: 'null'
            - type: object
              required: [message, links]
              properties:
                message: { type: string }
                links: { type: array, items: { $ref: '#/components/schemas/AssistantLink' } }
        error: { type: [string, 'null'] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    AssistantTurnEvent:
      description: One server-sent event of a turn; `type` is also the SSE event name.
      oneOf:
        - type: object
          required: [type, message]
          properties: { type: { const: user_message }, message: { $ref: '#/components/schemas/AssistantMessage' } }
        - type: object
          required: [type, delta]
          properties: { type: { const: text }, delta: { type: string } }
        - type: object
          required: [type, tool]
          properties: { type: { const: tool }, tool: { $ref: '#/components/schemas/AssistantToolActivity' } }
        - type: object
          required: [type, action]
          properties: { type: { const: proposal }, action: { $ref: '#/components/schemas/AssistantAction' } }
        - type: object
          required: [type, notice]
          properties: { type: { const: notice }, notice: { type: object } }
        - type: object
          required: [type, code, message]
          properties: { type: { const: error }, code: { type: string }, message: { type: string } }
        - type: object
          required: [type, message, credits]
          properties:
            type: { const: done }
            message: { oneOf: [{ $ref: '#/components/schemas/AssistantMessage' }, { type: 'null' }] }
            credits: { $ref: '#/components/schemas/AiCredits' }
    MemoryInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 280 }
    MemoryEntry:
      type: object
      required: [id, text, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    # ---------------------------------------------------------------- marketplace (section 18)
    MarketplaceCategory:
      type: object
      required: [key, label, plural]
      properties:
        key: { type: string, description: 'URL-safe key, e.g. `car-wash`.' }
        label: { type: string }
        plural: { type: string }
    MarketplaceCity:
      type: object
      required: [slug, name, county, latitude, longitude, listingCount]
      properties:
        slug: { type: string }
        name: { type: string }
        county: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        listingCount: { type: integer, description: Visible listings within 20 km. }
    MarketplaceMeta:
      type: object
      required: [categories, cities]
      properties:
        categories: { type: array, items: { $ref: '#/components/schemas/MarketplaceCategory' } }
        cities: { type: array, items: { $ref: '#/components/schemas/MarketplaceCity' } }
    NextSlot:
      type: object
      required: [start, serviceId, serviceName, optionId, optionName, priceCents, offer]
      properties:
        start: { type: string, format: date-time }
        serviceId: { type: string, format: uuid }
        serviceName: { type: string }
        optionId: { type: [string, 'null'], description: A service with options is shown with its cheapest option. }
        optionName: { type: [string, 'null'] }
        priceCents: { type: integer }
        offer:
          oneOf:
            - $ref: '#/components/schemas/SlotOffer'
            - type: 'null'
    Listing:
      type: object
      required: [business, category, distanceKm, rating, priceFromCents, currency, nextSlots, deals]
      properties:
        business:
          type: object
          required: [id, slug, name, description, timezone, address, branding, location]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
            description: { type: [string, 'null'] }
            timezone: { type: string }
            address: { $ref: '#/components/schemas/Address' }
            branding: { $ref: '#/components/schemas/Branding' }
            location:
              type: [object, 'null']
              properties:
                latitude: { type: number }
                longitude: { type: number }
        category: { $ref: '#/components/schemas/MarketplaceCategory' }
        distanceKm: { type: [number, 'null'], description: 'From the search centre, 0.1 km precision; `null` without a location.' }
        rating:
          description: Always null until real reviews exist (never invented).
          oneOf:
            - type: object
              required: [average, count]
              properties:
                average: { type: number }
                count: { type: integer }
            - type: 'null'
        priceFromCents: { type: [integer, 'null'] }
        currency: { type: string }
        nextSlots: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/NextSlot' } }
        deals: { type: array, items: { $ref: '#/components/schemas/PublicOffer' } }
    MarketplaceSearchResult:
      type: object
      required: [items, nextCursor, center]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Listing' } }
        nextCursor: { type: [string, 'null'] }
        center:
          type: [object, 'null']
          properties:
            latitude: { type: number }
            longitude: { type: number }
            radiusKm: { type: number }
            label: { type: [string, 'null'] }
    MarketplaceSettings:
      type: object
      required: [listed, category, eligible, location, locationStatus, categories]
      properties:
        listed: { type: boolean }
        category: { type: string }
        eligible: { type: boolean, description: Pro and Business plans. }
        location:
          type: [object, 'null']
          properties:
            latitude: { type: number }
            longitude: { type: number }
            precision: { type: string, enum: [address, postcode, city] }
            source: { type: string, description: '`mapbox` or `table`.' }
            geocodedAt: { type: string, format: date-time }
        locationStatus: { type: string, enum: [located, pending, not_found, missing_address] }
        categories: { type: array, items: { $ref: '#/components/schemas/MarketplaceCategory' } }
    MarketplaceSettingsInput:
      type: object
      required: [listed]
      properties:
        listed: { type: boolean }
        category: { type: string }

    # ---------------------------------------------------------------- offers (section 19)
    Discount:
      oneOf:
        - type: object
          required: [type, percent]
          properties:
            type: { const: percent }
            percent: { type: integer, minimum: 1, maximum: 100 }
        - type: object
          required: [type, amountCents]
          properties:
            type: { const: fixed }
            amountCents: { type: integer, minimum: 1 }
      discriminator: { propertyName: type }
    OfferSchedule:
      type: object
      properties:
        daysOfWeek: { type: array, items: { type: integer, minimum: 1, maximum: 7 }, description: 'ISO days (Mon = 1); empty = every day.' }
        timeWindows:
          type: array
          maxItems: 6
          description: 'Local `HH:mm` ranges, end after start, no overlap; a slot matches when its start is inside one. Empty = all day.'
          items:
            type: object
            required: [start, end]
            properties:
              start: { type: string, pattern: '^\d{2}:\d{2}$' }
              end: { type: string, pattern: '^\d{2}:\d{2}$' }
        lastMinuteHours: { type: [integer, 'null'], minimum: 1, maximum: 168, description: Slots starting within this many hours of now. }
    OfferInput:
      type: object
      required: [name, serviceIds, discount]
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 300 }
        serviceIds: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: uuid } }
        discount: { $ref: '#/components/schemas/Discount' }
        schedule: { $ref: '#/components/schemas/OfferSchedule' }
        validFrom: { type: [string, 'null'], format: date }
        validUntil: { type: [string, 'null'], format: date }
        maxRedemptions: { type: [integer, 'null'], minimum: 1, maximum: 100000 }
        active: { type: boolean, default: true }
    Offer:
      type: object
      required: [id, name, description, serviceIds, discount, schedule, validFrom, validUntil, maxRedemptions, status, kind, label, summary, redemptions, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        serviceIds: { type: array, items: { type: string, format: uuid } }
        discount: { $ref: '#/components/schemas/Discount' }
        schedule: { $ref: '#/components/schemas/OfferSchedule' }
        validFrom: { type: [string, 'null'], format: date }
        validUntil: { type: [string, 'null'], format: date }
        maxRedemptions: { type: [integer, 'null'] }
        status: { type: string, enum: [active, paused] }
        kind: { type: string, enum: [off_peak, last_minute, always] }
        label: { type: string, description: '"20% off", "€5 off".' }
        summary: { type: string, description: '"Tue, 13:00–17:00".' }
        redemptions: { type: integer, description: Bookings holding the offer (not cancelled or expired). }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicOffer:
      type: object
      required: [id, name, description, kind, discount, label, summary, serviceIds, validUntil]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        kind: { type: string, enum: [off_peak, last_minute, always] }
        discount: { $ref: '#/components/schemas/Discount' }
        label: { type: string }
        summary: { type: string }
        serviceIds: { type: array, items: { type: string, format: uuid } }
        validUntil: { type: [string, 'null'], format: date }
    SlotOffer:
      type: object
      required: [id, name, label, originalPriceCents, priceCents]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        label: { type: string }
        originalPriceCents: { type: integer }
        priceCents: { type: integer }
    BookingOffer:
      type: object
      description: The offer applied to a booking (price snapshot).
      required: [id, name, label, originalPriceCents, discountCents]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        label: { type: string }
        originalPriceCents: { type: integer }
        discountCents: { type: integer }
    ReleaseScheduleInput:
      type: object
      required: [name, serviceIds, cadence, time]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        serviceIds: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: uuid } }
        everyone: { type: boolean, default: true, description: 'True: every customer. False: the customers in `groupIds`.' }
        groupIds: { type: array, maxItems: 20, items: { type: string, format: uuid }, default: [] }
        cadence: { type: string, enum: [daily, weekly] }
        time: { type: string, pattern: '^\d{2}:\d{2}$', description: 'Release time, HH:mm in the business timezone.' }
        daysBefore: { type: [integer, 'null'], minimum: 0, maximum: 14, description: 'Daily (required): open each day this many days before it.' }
        weekdaysOnly: { type: boolean, default: false, description: 'Daily: a release on a Saturday or Sunday happens on the Friday before.' }
        weekday: { type: [integer, 'null'], minimum: 1, maximum: 7, description: 'Weekly (required): the release day, ISO (Monday = 1).' }
        weeksAhead: { type: [integer, 'null'], minimum: 1, maximum: 4, description: 'Weekly (required): weeks before a week (Monday to Sunday) it opens.' }
        active: { type: boolean, default: true }
    ReleaseSchedule:
      type: object
      required: [id, name, serviceIds, everyone, groupIds, cadence, time, daysBefore, weekdaysOnly, weekday, weeksAhead, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        serviceIds: { type: array, items: { type: string, format: uuid } }
        everyone: { type: boolean }
        groupIds: { type: array, items: { type: string, format: uuid } }
        cadence: { type: string, enum: [daily, weekly] }
        time: { type: string, description: HH:mm. }
        daysBefore: { type: [integer, 'null'] }
        weekdaysOnly: { type: boolean }
        weekday: { type: [integer, 'null'] }
        weeksAhead: { type: [integer, 'null'] }
        status: { type: string, enum: [active, paused] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReleaseChangeInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [open_now, move, hold] }
        opensAt: { type: [string, 'null'], format: date-time, description: 'For `move`: when it opens (before the day ends).' }
        scope: { type: string, enum: [release, day], default: release, description: '`release`: every day opened at the same moment (a week, a weekend); `day`: just this date.' }
    Releases:
      type: object
      required: [timezone, from, to, schedules]
      properties:
        timezone: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        schedules:
          type: array
          items: { $ref: '#/components/schemas/ScheduleReleases' }
    ScheduleReleases:
      type: object
      required: [scheduleId, name, days]
      properties:
        scheduleId: { type: string, format: uuid }
        name: { type: string }
        days:
          type: array
          items: { $ref: '#/components/schemas/ReleaseDay' }
    ReleaseDay:
      type: object
      required: [date, scheduledAt, opensAt, state, changed, changedBy, changedAt, times]
      properties:
        date: { type: string, format: date }
        scheduledAt: { type: string, format: date-time, description: When the schedule opens this day. }
        opensAt: { type: [string, 'null'], format: date-time, description: 'When it opens with any change applied; `null` when held.' }
        state: { type: string, enum: [open, scheduled, moved, held] }
        changed: { type: boolean, description: 'A change moved, held or opened this day.' }
        changedBy: { type: [string, 'null'] }
        changedAt: { type: [string, 'null'], format: date-time }
        times: { type: integer, description: 'Distinct free start times of the schedule''s public services for its customers, open yet or not.' }
    OfferPreviewInput:
      type: object
      required: [offer]
      properties:
        offer: { $ref: '#/components/schemas/OfferInput' }
        from: { type: string, format: date }
        days: { type: integer, minimum: 1, maximum: 14, default: 7 }
    OfferPreview:
      type: object
      required: [timezone, currency, from, to, totalSlots, affectedSlots, days]
      properties:
        timezone: { type: string }
        currency: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        totalSlots: { type: integer }
        affectedSlots: { type: integer }
        days:
          type: array
          items:
            type: object
            required: [date, slots]
            properties:
              date: { type: string, format: date }
              slots:
                type: array
                maxItems: 200
                items:
                  type: object
                  required: [start, serviceId, serviceName, originalPriceCents, priceCents]
                  properties:
                    start: { type: string, format: date-time }
                    serviceId: { type: string, format: uuid }
                    serviceName: { type: string }
                    originalPriceCents: { type: integer }
                    priceCents: { type: integer }

    # ---------------------------------------------------------------- OAuth (section 20)
    OAuthError:
      type: object
      required: [error, error_description]
      properties:
        error: { type: string }
        error_description: { type: string }
    OAuthTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope]
      properties:
        access_token: { type: string, description: 'Opaque, `bat_` prefix.' }
        token_type: { const: Bearer }
        expires_in: { type: integer }
        refresh_token: { type: string, description: 'Opaque, `bar_` prefix, single use.' }
        scope: { type: string }
    OAuthClientRegistration:
      type: object
      required: [client_id, client_id_issued_at, client_name, redirect_uris, grant_types, response_types, token_endpoint_auth_method]
      properties:
        client_id: { type: string }
        client_id_issued_at: { type: integer }
        client_name: { type: string }
        client_uri: { type: [string, 'null'] }
        redirect_uris: { type: array, items: { type: string } }
        grant_types: { type: array, items: { type: string } }
        response_types: { type: array, items: { type: string } }
        token_endpoint_auth_method: { const: none }
    AuthorizationServerMetadata:
      type: object
      properties:
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        registration_endpoint: { type: string }
        revocation_endpoint: { type: string }
        scopes_supported: { type: array, items: { type: string } }
        response_types_supported: { type: array, items: { type: string } }
        grant_types_supported: { type: array, items: { type: string } }
        token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
        code_challenge_methods_supported: { type: array, items: { type: string } }
        client_id_metadata_document_supported: { type: boolean }
        authorization_response_iss_parameter_supported: { type: boolean }
    ProtectedResourceMetadata:
      type: object
      properties:
        resource: { type: string }
        authorization_servers: { type: array, items: { type: string } }
        scopes_supported: { type: array, items: { type: string } }
        bearer_methods_supported: { type: array, items: { type: string } }
        resource_name: { type: string }
        resource_documentation: { type: string }
    OAuthScope:
      type: object
      required: [key, label, description]
      properties:
        key: { type: string, enum: ['bookings:read', 'bookings:write', 'marketplace:read'] }
        label: { type: string }
        description: { type: string }
    AuthorizeRequest:
      type: object
      properties:
        clientId: { type: [string, 'null'] }
        redirectUri: { type: [string, 'null'] }
        responseType: { type: [string, 'null'] }
        codeChallenge: { type: [string, 'null'] }
        codeChallengeMethod: { type: [string, 'null'] }
        scope: { type: [string, 'null'] }
        state: { type: [string, 'null'] }
        resource: { type: [string, 'null'] }
    AuthorizeCheck:
      oneOf:
        - type: object
          required: [type, client, scopes, resource, audience, user, previouslyApproved]
          properties:
            type: { const: consent }
            client:
              type: object
              required: [clientId, name, uri, kind, redirectUri, redirectHost, localOnly]
              properties:
                clientId: { type: string }
                name: { type: string }
                uri: { type: [string, 'null'] }
                kind: { type: string, enum: [dynamic, metadata_document] }
                redirectUri: { type: string }
                redirectHost: { type: string }
                localOnly: { type: boolean, description: Only loopback or app redirects (warn the user). }
            scopes: { type: array, items: { $ref: '#/components/schemas/OAuthScope' } }
            resource: { type: string }
            audience:
              type: string
              enum: [customer, business]
              description: The customer MCP (the user's own bookings) or the business MCP (the businesses they belong to).
            user:
              type: object
              properties:
                email: { type: [string, 'null'] }
                name: { type: [string, 'null'] }
            previouslyApproved: { type: boolean }
            businesses:
              type: array
              description: Business audience only, every business the connection reaches. Without any, the check is 409 POLICY_VIOLATION.
              items:
                type: object
                required: [name, slug, role, aiAgentsAllowed]
                properties:
                  name: { type: string }
                  slug: { type: string }
                  role: { $ref: '#/components/schemas/Role' }
                  aiAgentsAllowed: { type: boolean, description: "False when the owner doesn't let this member use AI apps there." }
        - type: object
          required: [type, redirectTo]
          properties:
            type: { const: redirect }
            redirectTo: { type: string }
      discriminator: { propertyName: type }
    ConnectedApp:
      type: object
      required: [id, clientId, name, clientUri, kind, redirectHost, audience, scopes, connectedAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid, description: The grant id. }
        clientId: { type: string }
        name: { type: string }
        clientUri: { type: [string, 'null'] }
        kind: { type: string, enum: [dynamic, metadata_document] }
        redirectHost: { type: string }
        audience: { type: string, enum: [customer, business], description: 'Which MCP server the app is connected to.' }
        scopes: { type: array, items: { $ref: '#/components/schemas/OAuthScope' } }
        connectedAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
